<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分规则管理 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 全局CSS变量 */
        :root {
            --primary-color: #667eea;
            --primary-dark: #5a6fd8;
            --secondary-color: #764ba2;
            --success-color: #48bb78;
            --warning-color: #ed8936;
            --danger-color: #f56565;
            --light-gray: #f7fafc;
            --medium-gray: #e2e8f0;
            --dark-gray: #4a5568;
            --text-color: #2d3748;
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --card-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px;
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            border-left: 4px solid var(--primary-color);
        }

        .header h1 {
            color: var(--text-color);
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--primary-color);
        }

        .card {
            background: white;
            border-radius: var(--card-radius);
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 i {
            color: var(--primary-color);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.4);
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(237, 137, 54, 0.4);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 101, 101, 0.4);
        }

        .rules-list {
            display: grid;
            gap: 15px;
        }

        .rule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            background: white;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: var(--transition);
        }

        .rule-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .rule-info h4 {
            color: var(--text-color);
            margin-bottom: 5px;
            font-size: 18px;
        }

        .rule-details {
            font-size: 14px;
            color: var(--dark-gray);
        }

        .rule-points {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--dark-gray);
        }

        .empty-state i {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--medium-gray);
        }

        .empty-state p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-gray);
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--medium-gray);
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            background: var(--light-gray);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            border-radius: var(--card-radius);
            padding: 35px;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--light-gray);
        }

        .modal-header h3 {
            color: var(--text-color);
            margin: 0;
            font-size: 22px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark-gray);
            padding: 0;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--light-gray);
            color: var(--text-color);
            transform: rotate(90deg);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 20px 25px;
                margin-bottom: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header h1 i {
                font-size: 28px;
            }

            .card {
                padding: 25px;
            }

            .card h3 {
                font-size: 20px;
            }

            .stats-cards {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-number {
                font-size: 28px;
            }

            .rule-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .rule-points {
                align-self: flex-end;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input {
                width: 100%;
                min-width: auto;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                padding: 25px;
                margin: 20px;
            }
        }

        .rule-actions {
            display: flex;
            gap: 10px;
            margin-left: 15px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 250px;
            padding: 14px 18px;
            border: 2px solid var(--medium-gray);
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            background: var(--light-gray);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--card-radius);
            padding: 25px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--dark-gray);
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-cog"></i> 积分规则管理</h1>
        <button class="btn btn-primary" onclick="window.location.href='/dashboard.html'">
            <i class="fas fa-arrow-left"></i> 返回仪表盘
        </button>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-cards">
        <div class="stat-card">
            <div class="stat-number" id="totalRules">0</div>
            <div class="stat-label">总规则数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="avgPoints">0</div>
            <div class="stat-label">平均积分</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="maxPoints">0</div>
            <div class="stat-label">最高积分</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="minPoints">0</div>
            <div class="stat-label">最低积分</div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3><i class="fas fa-list"></i> 积分规则列表</h3>
            <button class="btn btn-primary" onclick="showAddRuleModal()">
                <i class="fas fa-plus"></i> 添加规则
            </button>
        </div>

        <!-- 搜索和筛选功能 -->
        <div class="search-box">
            <input type="text" id="searchRules" placeholder="搜索活动类型..." oninput="filterRules()">
        </div>

        <div id="rulesList" class="rules-list">
            <!-- 积分规则将通过JavaScript动态生成 -->
        </div>
    </div>
</div>

<!-- 添加积分规则模态框 -->
<div id="addRuleModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-plus-circle"></i> <span id="modalTitle">添加积分规则</span></h3>
            <button class="modal-close" onclick="closeAddRuleModal()">&times;</button>
        </div>
        <form id="addRuleForm">
            <input type="hidden" id="editRuleId">
            <div class="form-group">
                <label for="activityType"><i class="fas fa-tag"></i> 活动类型</label>
                <input type="text" id="activityType"
                       placeholder="请输入活动类型（如：学术讲座、文体活动、志愿公益等）" required>
                <small style="color: #666; margin-top: 5px; display: block;">
                    活动类型必须唯一，不能重复
                </small>
            </div>
            <div class="form-group">
                <label for="basePointsValue"><i class="fas fa-star"></i> 基础积分</label>
                <input type="number" id="basePointsValue"
                       placeholder="请输入基础积分值" min="1" max="100" required>
                <small style="color: #666; margin-top: 5px; display: block;">
                    设置该类型活动参与后获得的积分值（1-100）
                </small>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                <button type="button" class="btn" onclick="closeAddRuleModal()"
                        style="background: #6c757d; color: white;">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button type="submit" class="btn btn-primary" id="submitRuleBtn">
                    <i class="fas fa-save"></i> 保存规则
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 删除确认模态框 -->
<div id="deleteConfirmModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-exclamation-triangle"></i> 确认删除</h3>
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
        </div>
        <div style="padding: 20px 0;">
            <p>确定要删除这个积分规则吗？此操作不可恢复。</p>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">
                删除后，新创建的活动将无法选择此规则。
            </p>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn" onclick="closeDeleteModal()"
                    style="background: #6c757d; color: white;">
                <i class="fas fa-times"></i> 取消
            </button>
            <button class="btn btn-danger" onclick="confirmDeleteRule()">
                <i class="fas fa-trash"></i> 确认删除
            </button>
        </div>
    </div>
</div>

<script>
    let pointsRules = [];
    let currentDeleteRuleId = null;

    // 页面加载初始化
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        loadPointsRules();
    });

    // 检查登录状态
    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            alert('请先登录');
            window.location.href = '/index.html';
            return;
        }

        // 检查是否为老师
        if (user.role !== 'TEACHER') {
            alert('您没有权限访问此页面');
            window.location.href = '/dashboard.html';
            return;
        }
    }

    // 加载积分规则
    async function loadPointsRules() {
        try {
            const response = await fetch('/api/points/rules');
            const result = await response.json();
            const container = document.getElementById('rulesList');

            if (result.success && result.data && result.data.length > 0) {
                pointsRules = result.data;
                displayPointsRules(pointsRules);
                updateStats(pointsRules);
            } else {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-cog"></i>
                            <p>暂无积分规则</p>
                            <p>点击"添加规则"按钮创建新的积分规则</p>
                        </div>
                    `;
                updateStats([]);
            }
        } catch (error) {
            console.error('加载积分规则错误:', error);
            const container = document.getElementById('rulesList');
            container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>加载失败</p>
                        <p>请刷新页面重试</p>
                    </div>
                `;
        }
    }

    // 更新统计信息
    function updateStats(rules) {
        document.getElementById('totalRules').textContent = rules.length;

        if (rules.length > 0) {
            const points = rules.map(rule => rule.basePointsValue);
            const avgPoints = points.reduce((a, b) => a + b, 0) / points.length;
            const maxPoints = Math.max(...points);
            const minPoints = Math.min(...points);

            document.getElementById('avgPoints').textContent = avgPoints.toFixed(1);
            document.getElementById('maxPoints').textContent = maxPoints;
            document.getElementById('minPoints').textContent = minPoints;
        } else {
            document.getElementById('avgPoints').textContent = '0';
            document.getElementById('maxPoints').textContent = '0';
            document.getElementById('minPoints').textContent = '0';
        }
    }

    // 显示积分规则
    function displayPointsRules(rules) {
        const container = document.getElementById('rulesList');

        if (rules.length > 0) {
            container.innerHTML = rules.map(rule => {
                return `
                        <div class="rule-item">
                            <div class="rule-info">
                                <h4>${rule.activityType}</h4>
                                <div class="rule-details">
                                    最后更新: ${formatDateTime(rule.lastUpdated)} |
                                    规则ID: ${rule.ruleId}
                                </div>
                            </div>
                            <div class="rule-points">${rule.basePointsValue} 积分</div>
                            <div class="rule-actions">
                                <button class="btn btn-warning" onclick="editRule(${rule.ruleId})"
                                        style="padding: 8px 12px; font-size: 12px;">
                                    <i class="fas fa-edit"></i> 编辑
                                </button>
                                <button class="btn btn-danger" onclick="showDeleteModal(${rule.ruleId})"
                                        style="padding: 8px 12px; font-size: 12px;">
                                    <i class="fas fa-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                    `;
            }).join('');
        } else {
            container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>未找到匹配的规则</p>
                    </div>
                `;
        }
    }

    // 筛选规则
    function filterRules() {
        const searchTerm = document.getElementById('searchRules').value.toLowerCase();
        const filteredRules = pointsRules.filter(rule =>
            rule.activityType.toLowerCase().includes(searchTerm)
        );
        displayPointsRules(filteredRules);
    }

    // 显示添加规则模态框
    function showAddRuleModal() {
        document.getElementById('modalTitle').textContent = '添加积分规则';
        document.getElementById('addRuleForm').reset();
        document.getElementById('editRuleId').value = '';
        document.getElementById('submitRuleBtn').innerHTML = '<i class="fas fa-save"></i> 保存规则';
        document.getElementById('addRuleModal').style.display = 'flex';
    }

    // 编辑规则
    function editRule(ruleId) {
        const rule = pointsRules.find(r => r.ruleId === ruleId);
        if (rule) {
            document.getElementById('modalTitle').textContent = '编辑积分规则';
            document.getElementById('editRuleId').value = rule.ruleId;
            document.getElementById('activityType').value = rule.activityType;
            document.getElementById('basePointsValue').value = rule.basePointsValue;
            document.getElementById('submitRuleBtn').innerHTML = '<i class="fas fa-save"></i> 更新规则';
            document.getElementById('addRuleModal').style.display = 'flex';
        }
    }

    // 关闭添加规则模态框
    function closeAddRuleModal() {
        document.getElementById('addRuleModal').style.display = 'none';
    }

    // 显示删除确认模态框
    function showDeleteModal(ruleId) {
        currentDeleteRuleId = ruleId;
        document.getElementById('deleteConfirmModal').style.display = 'flex';
    }

    // 关闭删除确认模态框
    function closeDeleteModal() {
        document.getElementById('deleteConfirmModal').style.display = 'none';
        currentDeleteRuleId = null;
    }

    // 确认删除规则
    async function confirmDeleteRule() {
        if (!currentDeleteRuleId) return;

        try {
            const response = await fetch(`/api/points/rules/${currentDeleteRuleId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                alert('积分规则删除成功！');
                closeDeleteModal();
                loadPointsRules();
            } else {
                alert('删除失败: ' + result.message);
            }
        } catch (error) {
            console.error('删除积分规则错误:', error);
            alert('删除时发生错误，请稍后重试');
        }
    }

    // 添加/更新积分规则
    document.getElementById('addRuleForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const activityType = document.getElementById('activityType').value.trim();
        const basePointsValue = parseInt(document.getElementById('basePointsValue').value);
        const ruleId = document.getElementById('editRuleId').value;

        if (!activityType) {
            alert('请输入活动类型');
            return;
        }

        if (!basePointsValue || basePointsValue < 1 || basePointsValue > 100) {
            alert('请输入有效的积分值（1-100）');
            return;
        }

        const ruleData = {
            activityType: activityType,
            basePointsValue: basePointsValue
        };

        try {
            let response;
            if (ruleId) {
                // 更新规则
                response = await fetch(`/api/points/rules/${ruleId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(ruleData)
                });
            } else {
                // 添加规则
                response = await fetch('/api/points/rules', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(ruleData)
                });
            }

            const result = await response.json();

            if (result.success) {
                alert(ruleId ? '积分规则更新成功！' : '积分规则添加成功！');
                closeAddRuleModal();
                loadPointsRules();
            } else {
                alert((ruleId ? '更新' : '添加') + '失败: ' + result.message);
            }
        } catch (error) {
            console.error('操作积分规则错误:', error);
            alert('操作时发生错误，请稍后重试');
        }
    });

    // 工具函数：格式化日期时间
    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return '未知时间';
        const date = new Date(dateTimeStr);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
</script>
