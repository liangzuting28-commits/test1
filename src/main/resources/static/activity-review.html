<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动审核 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 全局CSS变量 */
        :root {
            --primary-color: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            --warning-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --bg-color: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            --card-bg: #ffffff;
            --card-bg-hover: #fefefe;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.16);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.2);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 25px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 页面头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            background: var(--card-bg);
            padding: 28px 35px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border-top: 4px solid var(--primary-color);
            transition: var(--transition);
        }

        .header:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: var(--primary-color);
            font-size: 34px;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
            border: 1px solid #f3f4f6;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary-gradient);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            background: var(--card-bg-hover);
        }

        .card h3 {
            color: var(--text-primary);
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
        }

        .card h3 i {
            color: var(--primary-color);
            font-size: 24px;
        }

        /* 按钮样式 */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-success {
            background: var(--success-gradient);
            color: white;
        }

        .btn-danger {
            background: var(--danger-gradient);
            color: white;
        }

        .btn-warning {
            background: var(--warning-gradient);
            color: white;
        }

        /* 活动网格 */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        /* 活动卡片 */
        .activity-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid #f3f4f6;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        .activity-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .activity-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-gradient);
        }

        .activity-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .activity-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 5px;
        }

        .activity-club {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .activity-status {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-pending {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            border: 1px solid #fde68a;
            box-shadow: 0 2px 4px rgba(245, 158, 11, 0.1);
        }

        .status-published {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 1px solid #c3e6cb;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.1);
        }

        .status-rejected {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 1px solid #f5c6cb;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.1);
        }

        /* 活动信息 */
        .activity-info {
            display: grid;
            gap: 16px;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: var(--radius-md);
            border: 1px solid #e2e8f0;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            transition: var(--transition);
        }

        .info-item:hover {
            color: var(--text-primary);
        }

        .info-item i {
            color: var(--primary-color);
            width: 18px;
            text-align: center;
            font-size: 16px;
        }

        .activity-description {
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 14px;
            padding: 15px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary-color);
        }

        .activity-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        /* 驳回原因 */
        .reject-reason {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 20px;
            border-radius: var(--radius-md);
            margin: 15px 0;
            font-size: 14px;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.05);
        }

        .reject-reason strong {
            color: #ef4444;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            background: #f8fafc;
            border-radius: var(--radius-lg);
            border: 2px dashed #e2e8f0;
        }

        .empty-state i {
            font-size: 80px;
            margin-bottom: 25px;
            color: #cbd5e1;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state p {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .empty-state .subtext {
            font-size: 14px;
            color: var(--text-light);
            max-width: 400px;
            margin: 0 auto;
        }

        /* 驳回模态框 */
        .reject-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .reject-modal-content {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 550px;
            padding: 35px;
            box-shadow: var(--shadow-hover);
            animation: modalSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f3f4f6;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .reject-modal-header {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .reject-modal-header h3 {
            color: var(--text-primary);
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reject-modal-header h3 i {
            color: var(--danger-color);
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-modal:hover {
            color: var(--primary-color);
            background: #f1f5f9;
        }

        .reject-modal-body {
            margin-bottom: 25px;
        }

        .reject-modal-body label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 15px;
        }

        .reject-modal-body textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius-md);
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
            transition: var(--transition);
            background: #f8fafc;
            font-family: inherit;
        }

        .reject-modal-body textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .reject-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: #f8fafc;
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: var(--shadow-md);
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 1;
            min-width: 140px;
            padding: 16px 24px;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition);
            font-weight: 600;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab:hover {
            background: #f1f5f9;
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .tab.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-lg);
            transform: translateY(-1px);
        }

        .tab i {
            font-size: 18px;
        }

        .tab-content {
            display: none;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 搜索和筛选区域样式 */
        .search-filter-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: var(--radius-lg);
            border: 1px solid #e2e8f0;
        }
        
        .search-box {
            position: relative;
            flex: 1;
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-md);
            font-size: 15px;
            transition: var(--transition);
            background: white;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .filter-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .filter-box select {
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-md);
            font-size: 15px;
            background: white;
            min-width: 150px;
            transition: var(--transition);
        }
        
        .filter-box select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 20px 25px;
                margin-bottom: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header h1 i {
                font-size: 28px;
            }

            .card {
                padding: 25px;
            }

            .card h3 {
                font-size: 20px;
            }

            .activity-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .activity-card {
                padding: 22px;
            }

            .activity-info {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .activity-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .tabs {
                padding: 8px;
            }

            .tab {
                padding: 12px 18px;
                font-size: 14px;
            }

            .reject-modal-content {
                padding: 25px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-clipboard-check"></i> 活动审核</h1>
        <button class="btn btn-primary" onclick="window.location.href='/dashboard.html'">
            <i class="fas fa-arrow-left"></i> 返回仪表盘
        </button>
    </div>

    <!-- 活动列表 -->
    <div class="card">
        <h3><i class="fas fa-list"></i> 待审核活动</h3>

        <!-- 选项卡 -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('pending')">待审核</div>
            <div class="tab" onclick="switchTab('approved')">已通过</div>
            <div class="tab" onclick="switchTab('rejected')">已驳回</div>
        </div>
        
        <!-- 搜索和筛选区域 -->
        <div class="search-filter-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索活动名称或社团名称..." onkeyup="filterActivities()">
            </div>
            <div class="filter-box">
                <select id="clubFilter" onchange="filterActivities()">
                    <option value="">所有社团</option>
                </select>
                <select id="dateFilter" onchange="filterActivities()">
                    <option value="">所有时间</option>
                    <option value="today">今天</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                </select>
            </div>
        </div>

        <!-- 待审核活动 -->
        <div id="pending" class="tab-content active">
            <div id="pendingActivitiesList" class="activity-grid">
                <!-- 动态生成活动列表 -->
            </div>
        </div>

        <!-- 已通过活动 -->
        <div id="approved" class="tab-content">
            <div id="approvedActivitiesList" class="activity-grid">
                <!-- 动态生成活动列表 -->
            </div>
        </div>

        <!-- 已驳回活动 -->
        <div id="rejected" class="tab-content">
            <div id="rejectedActivitiesList" class="activity-grid">
                <!-- 动态生成活动列表 -->
            </div>
        </div>
    </div>
</div>

<!-- 驳回原因弹窗 -->
<div id="rejectModal" class="reject-modal">
    <div class="reject-modal-content">
        <div class="reject-modal-header">
            <h3>驳回活动申请</h3>
            <span class="close-modal" onclick="closeRejectModal()">&times;</span>
        </div>
        <div class="reject-modal-body">
            <label for="rejectReason">驳回原因：</label>
            <textarea id="rejectReason" placeholder="请输入驳回该活动的原因..."></textarea>
        </div>
        <div class="reject-modal-footer">
            <button class="btn btn-primary" onclick="closeRejectModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmReject()">确认驳回</button>
        </div>
    </div>
</div>

<script>
    // 全局变量
    let currentUser = null;
    let currentActivityId = null;

    // 页面加载初始化
    document.addEventListener('DOMContentLoaded', function() {
        console.log('活动审核页面开始初始化...');
        checkLogin();
        loadClubOptions(); // 加载社团选项
    });

    // 检查登录状态
    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            alert('请先登录');
            window.location.href = '/index.html';
            return;
        }

        currentUser = user;
        console.log('当前用户信息:', currentUser);

        // 只有老师才能审核活动
        if (currentUser.role !== 'TEACHER') {
            alert('您没有权限审核活动');
            window.location.href = '/dashboard.html';
            return;
        }

        // 加载待审核活动
        loadPendingActivities();
        // 加载已通过活动
        loadApprovedActivities();
        // 加载已驳回活动
        loadRejectedActivities();
    }

    // 切换选项卡
    function switchTab(tabName) {
        // 更新选项卡样式
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        // 更新内容显示
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.getElementById(tabName).classList.add('active');
        
        // 应用当前的筛选条件
        filterActivities();
    }

    // 加载待审核活动
    async function loadPendingActivities() {
        try {
            const response = await fetch('/api/activity-manage/pending');
            const result = await response.json();
            const container = document.getElementById('pendingActivitiesList');

            if (result.success && result.data && result.data.length > 0) {
                container.innerHTML = result.data.map(activity => renderActivityCard(activity, 'pending')).join('');
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-check"></i>
                        <p>暂无待审核活动</p>
                        <p class="subtext">所有活动都已审核完毕</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('加载待审核活动错误:', error);
            const container = document.getElementById('pendingActivitiesList');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>加载失败</p>
                    <p class="subtext">请刷新页面重试</p>
                </div>
            `;
        }
    }

    // 加载已通过活动
    async function loadApprovedActivities() {
        try {
            const response = await fetch('/api/activity-manage/approved');
            const result = await response.json();
            const container = document.getElementById('approvedActivitiesList');

            if (result.success && result.data && result.data.length > 0) {
                container.innerHTML = result.data.map(activity => renderActivityCard(activity, 'PUBLISHED')).join('');
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>暂无已通过活动</p>
                        <p class="subtext">还没有活动通过审核</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('加载已通过活动错误:', error);
            const container = document.getElementById('approvedActivitiesList');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>加载失败</p>
                    <p class="subtext">请刷新页面重试</p>
                </div>
            `;
        }
    }

    // 加载已驳回活动
    async function loadRejectedActivities() {
        try {
            const response = await fetch('/api/activity-manage/rejected');
            const result = await response.json();
            const container = document.getElementById('rejectedActivitiesList');

            if (result.success && result.data && result.data.length > 0) {
                container.innerHTML = result.data.map(activity => renderActivityCard(activity, 'REJECTED')).join('');
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-times-circle"></i>
                        <p>暂无已驳回活动</p>
                        <p class="subtext">还没有活动被驳回</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('加载已驳回活动错误:', error);
            const container = document.getElementById('rejectedActivitiesList');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>加载失败</p>
                    <p class="subtext">请刷新页面重试</p>
                </div>
            `;
        }
    }

    // 渲染活动卡片
    function renderActivityCard(activity, status) {
        let statusBadge = '';
        let rejectInfo = '';
        let actions = '';

        // 根据状态设置徽章和操作按钮
        switch(status) {
            case 'pending':
                statusBadge = '<div class="activity-status status-pending"><i class="fas fa-clock"></i> 待审核</div>';
                actions = `
                    <button class="btn btn-success" onclick="approveActivity(${activity.activityId})">
                        <i class="fas fa-check"></i> 通过
                    </button>
                    <button class="btn btn-danger" onclick="showRejectModal(${activity.activityId})">
                        <i class="fas fa-times"></i> 驳回
                    </button>
                `;
                break;
            case 'PUBLISHED':
                statusBadge = '<div class="activity-status status-published"><i class="fas fa-check-circle"></i> 已通过</div>';
                actions = `
                    <button class="btn btn-info" onclick="viewActivityDetails(${activity.activityId})">
                        <i class="fas fa-info-circle"></i> 查看详情
                    </button>
                `;
                break;
            case 'REJECTED':
                statusBadge = '<div class="activity-status status-rejected"><i class="fas fa-times-circle"></i> 已驳回</div>';
                rejectInfo = activity.rejectReason ? `
                    <div class="reject-reason">
                        <strong><i class="fas fa-exclamation-triangle"></i> 驳回原因：</strong>${activity.rejectReason}
                    </div>
                ` : '';
                actions = `
                    <button class="btn btn-info" onclick="viewActivityDetails(${activity.activityId})">
                        <i class="fas fa-info-circle"></i> 查看详情
                    </button>
                `;
                break;
        }

        return `
            <div class="activity-card">
                <div class="activity-header">
                    <div>
                        <div class="activity-title">${activity.activityName}</div>
                        <div class="activity-club">${activity.clubName || '未知社团'}</div>
                    </div>
                    ${statusBadge}
                </div>
                <div class="activity-info">
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <span>${formatDateTime(activity.activityTime)}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>${activity.location}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-users"></i>
                        <span>${activity.maxParticipants === 0 ? '无限制' : activity.maxParticipants + '人'}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-star"></i>
                        <span>${activity.awardPoints} 积分</span>
                    </div>
                </div>
                <div class="activity-description">
                    ${activity.description || '暂无详细描述'}
                </div>
                ${rejectInfo}
                <div class="activity-actions">
                    ${actions}
                </div>
            </div>
        `;
    }

    // 通过活动
    async function approveActivity(activityId) {
        if (!confirm('确定要通过这个活动申请吗？')) {
            return;
        }

        try {
            const response = await fetch(`/api/activity-manage/${activityId}/review`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    status: 'PUBLISHED',
                    reason: ''
                })
            });

            const result = await response.json();

            if (result.success) {
                alert('✅ 活动审核通过！');
                // 刷新所有列表
                loadPendingActivities();
                loadApprovedActivities();
            } else {
                alert('❌ 审核失败: ' + result.message);
            }
        } catch (error) {
            console.error('审核活动错误:', error);
            alert('❌ 审核时发生错误');
        }
    }

    // 显示驳回弹窗
    function showRejectModal(activityId) {
        currentActivityId = activityId;
        document.getElementById('rejectModal').style.display = 'flex';
        document.getElementById('rejectReason').value = '';
        document.getElementById('rejectReason').focus();
    }

    // 关闭驳回弹窗
    function closeRejectModal() {
        document.getElementById('rejectModal').style.display = 'none';
        currentActivityId = null;
    }

    // 确认驳回
    async function confirmReject() {
        const rejectReason = document.getElementById('rejectReason').value.trim();

        if (!rejectReason) {
            alert('请输入驳回原因');
            return;
        }

        try {
            const response = await fetch(`/api/activity-manage/${currentActivityId}/review`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    status: 'REJECTED',
                    reason: rejectReason
                })
            });

            const result = await response.json();

            if (result.success) {
                alert('✅ 活动已驳回！');
                closeRejectModal();
                // 刷新所有列表
                loadPendingActivities();
                loadRejectedActivities();
            } else {
                alert('❌ 驳回失败: ' + result.message);
            }
        } catch (error) {
            console.error('驳回活动错误:', error);
            alert('❌ 驳回时发生错误');
        }
    }

    // 查看活动详情
    async function viewActivityDetails(activityId) {
        try {
            const response = await fetch(`/api/activities/${activityId}`);
            const result = await response.json();

            if (result.success) {
                const activity = result.data;

                // 创建详情弹窗
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3><i class="fas fa-info-circle"></i> 活动详情</h3>
                            <span class="close-btn" onclick="document.querySelector('.modal').remove()">&times;</span>
                        </div>
                        <div class="modal-body">
                            <div class="activity-info">
                                <div class="info-item">
                                    <div class="info-label">活动名称:</div>
                                    <div class="info-value">${activity.activityName}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">所属社团:</div>
                                    <div class="info-value">${activity.clubName || '未知社团'}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">活动时间:</div>
                                    <div class="info-value">${formatDateTime(activity.activityTime)}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">活动地点:</div>
                                    <div class="info-value">${activity.location}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">人数限制:</div>
                                    <div class="info-value">${activity.maxParticipants === 0 ? '无限制' : activity.maxParticipants + '人'}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">积分奖励:</div>
                                    <div class="info-value">${activity.awardPoints} 积分</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">活动状态:</div>
                                    <div class="info-value">${getActivityStatusText(activity.status)}</div>
                                </div>
                                ${activity.rejectReason ? `
                                    <div class="info-item">
                                        <div class="info-label">驳回原因:</div>
                                        <div class="info-value">${activity.rejectReason}</div>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="activity-description">
                                <h4>活动描述:</h4>
                                <p>${activity.description || '暂无详细描述'}</p>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" onclick="document.querySelector('.modal').remove()">关闭</button>
                        </div>
                    </div>
                `;

                // 添加到页面
                document.body.appendChild(modal);

                // 添加样式（如果还没有添加）
                if (!document.querySelector('style[data-details-modal]')) {
                    const style = document.createElement('style');
                    style.setAttribute('data-details-modal', 'true');
                    style.textContent = `
                        .modal {
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background-color: rgba(0, 0, 0, 0.5);
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            z-index: 1000;
                        }

                        .modal-content {
                            background-color: white;
                            border-radius: 15px;
                            width: 90%;
                            max-width: 700px;
                            max-height: 90vh;
                            overflow-y: auto;
                            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
                        }

                        .modal-header {
                            padding: 20px;
                            border-bottom: 1px solid #eee;
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        }

                        .modal-header h3 {
                            margin: 0;
                            color: #333;
                        }

                        .close-btn {
                            font-size: 24px;
                            cursor: pointer;
                            color: #999;
                        }

                        .close-btn:hover {
                            color: #333;
                        }

                        .modal-body {
                            padding: 20px;
                        }

                        .activity-info {
                            margin-bottom: 20px;
                        }

                        .info-item {
                            display: flex;
                            margin-bottom: 10px;
                        }

                        .info-label {
                            width: 100px;
                            font-weight: 500;
                        }

                        .info-value {
                            flex: 1;
                        }

                        .modal-footer {
                            padding: 15px 20px;
                            border-top: 1px solid #eee;
                            text-align: right;
                        }
                    `;
                    document.head.appendChild(style);
                }
            } else {
                alert('获取活动详情失败: ' + result.message);
            }
        } catch (error) {
            console.error('查看活动详情错误:', error);
            alert('查看活动详情时发生错误，请稍后重试');
        }
    }

    // 获取活动状态文本
    function getActivityStatusText(status) {
        const statusMap = {
            'PENDING': '待审核',
            'PUBLISHED': '已发布',
            'REJECTED': '已驳回',
            'ENDED': '已结束'
        };
        return statusMap[status] || status;
    }

    // 加载社团选项
    async function loadClubOptions() {
        try {
            const response = await fetch('/api/clubs');
            const result = await response.json();
            const clubFilter = document.getElementById('clubFilter');
            
            if (result.success && result.data) {
                const clubOptions = result.data.map(club => 
                    `<option value="${club.clubId}">${club.clubName}</option>`
                ).join('');
                
                clubFilter.innerHTML = '<option value="">所有社团</option>' + clubOptions;
            }
        } catch (error) {
            console.error('加载社团选项失败:', error);
        }
    }
    
    // 筛选活动
    function filterActivities() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const clubId = document.getElementById('clubFilter').value;
        const dateFilter = document.getElementById('dateFilter').value;
        
        // 获取当前活动状态（待审核、已通过或已驳回）
        const activeTab = document.querySelector('.tab.active').textContent.trim();
        let status;
        
        if (activeTab === '待审核') {
            status = 'pending';
        } else if (activeTab === '已通过') {
            status = 'approved';
        } else if (activeTab === '已驳回') {
            status = 'rejected';
        }
        
        // 根据状态筛选活动
        filterActivitiesByStatus(status, searchTerm, clubId, dateFilter);
    }
    
    // 根据状态筛选活动
    async function filterActivitiesByStatus(status, searchTerm, clubId, dateFilter) {
        try {
            let endpoint;
            
            // 根据状态选择正确的API端点
            switch(status) {
                case 'pending':
                    endpoint = '/api/activity-manage/pending';
                    break;
                case 'approved':
                    endpoint = '/api/activity-manage/approved';
                    break;
                case 'rejected':
                    endpoint = '/api/activity-manage/rejected';
                    break;
            }
            
            const response = await fetch(endpoint);
            const result = await response.json();
            
            if (result.success && result.data) {
                let filteredActivities = result.data;
                
                // 按搜索词筛选
                if (searchTerm) {
                    filteredActivities = filteredActivities.filter(activity => {
                        const activityName = (activity.activityName || '').toLowerCase();
                        const clubName = (activity.clubName || '').toLowerCase();
                        return activityName.includes(searchTerm) || clubName.includes(searchTerm);
                    });
                }
                
                // 按社团筛选
                if (clubId) {
                    filteredActivities = filteredActivities.filter(activity => 
                        activity.clubId == clubId
                    );
                }
                
                // 按日期筛选
                if (dateFilter) {
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    
                    filteredActivities = filteredActivities.filter(activity => {
                        if (!activity.activityTime) return false;
                        
                        const activityDate = new Date(activity.activityTime);
                        
                        switch(dateFilter) {
                            case 'today':
                                return activityDate >= today && activityDate < new Date(today.getTime() + 24 * 60 * 60 * 1000);
                            case 'week':
                                const weekStart = new Date(today);
                                weekStart.setDate(today.getDate() - today.getDay());
                                return activityDate >= weekStart;
                            case 'month':
                                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                                return activityDate >= monthStart;
                            default:
                                return true;
                        }
                    });
                }
                
                // 更新显示的活动列表
                const containerId = status === 'pending' ? 'pendingActivitiesList' : 
                                  status === 'approved' ? 'approvedActivitiesList' : 
                                  'rejectedActivitiesList';
                
                const container = document.getElementById(containerId);
                
                if (filteredActivities.length > 0) {
                    const statusMap = {
                        'pending': 'pending',
                        'approved': 'PUBLISHED',
                        'rejected': 'REJECTED'
                    };
                    
                    container.innerHTML = filteredActivities.map(activity => 
                        renderActivityCard(activity, statusMap[status])
                    ).join('');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <p>没有找到符合条件的活动</p>
                            <p class="subtext">请尝试调整搜索条件</p>
                        </div>
                    `;
                }
            }
        } catch (error) {
            console.error('筛选活动错误:', error);
        }
    }
    
    // 工具函数：格式化日期时间
    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return '未设置';
        const date = new Date(dateTimeStr);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
</script>
