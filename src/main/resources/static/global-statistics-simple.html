<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全局CSS变量 */
        :root {
            --primary-color: #667eea;
            --primary-dark: #5a6fd8;
            --secondary-color: #764ba2;
            --success-color: #48bb78;
            --warning-color: #ed8936;
            --danger-color: #f56565;
            --light-gray: #f7fafc;
            --medium-gray: #e2e8f0;
            --dark-gray: #4a5568;
            --text-color: #2d3748;
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --card-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px;
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            border-left: 4px solid var(--primary-color);
        }

        .header h1 {
            color: var(--text-color);
            font-size: 28px;
            display: flex;
            align-items: center;
        }

        .header h1 i {
            margin-right: 15px;
            color: var(--primary-color);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--card-radius);
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
        }

        .stat-number {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary-color);
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .stat-label {
            color: var(--dark-gray);
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-desc {
            color: var(--dark-gray);
            font-size: 13px;
        }
        
        .stat-extra {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .extra-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        
        .extra-label {
            color: var(--dark-gray);
        }
        
        .extra-value {
            font-weight: 600;
            color: var(--primary-color);
        }

        .stat-icon {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 48px;
            opacity: 0.1;
            color: var(--primary-color);
        }

        .chart-container {
            background: white;
            border-radius: var(--card-radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .chart-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light-gray);
        }

        .chart-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
            margin-bottom: 20px;
        }

        .filter-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            color: var(--dark-gray);
            font-weight: 500;
        }

        .filter-group select {
            padding: 12px 16px;
            border: 2px solid var(--medium-gray);
            border-radius: 10px;
            font-size: 14px;
            min-width: 150px;
            transition: var(--transition);
            background: var(--light-gray);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .refresh-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--dark-gray);
        }

        .loading i {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(400px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--success-color);
        }

        .toast.error {
            border-left: 4px solid var(--danger-color);
        }

        .toast i {
            font-size: 24px;
        }

        .toast.success i {
            color: var(--success-color);
        }

        .toast.error i {
            color: var(--danger-color);
        }
        
        .stat-details {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        
        .stat-details-content {
            background: white;
            border-radius: var(--card-radius);
            padding: 35px;
            max-width: 700px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .stat-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--light-gray);
        }
        
        .stat-details-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--dark-gray);
            cursor: pointer;
            transition: var(--transition);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .close-btn:hover {
            color: var(--text-color);
            background: var(--light-gray);
            transform: rotate(90deg);
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .detail-label {
            color: var(--dark-gray);
            font-weight: 600;
        }
        
        .detail-value {
            color: var(--text-color);
            font-weight: 600;
            font-size: 16px;
        }
        
        .detail-section-title {
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 8px;
        }
        
        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .detail-list-item {
            background: var(--light-gray);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--primary-color);
            transition: var(--transition);
        }

        .detail-list-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .item-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        
        .item-desc {
            font-size: 14px;
            color: var(--dark-gray);
            margin-bottom: 8px;
        }
        
        .item-stats {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .error-message {
            color: var(--danger-color);
            padding: 20px;
            background: rgba(245, 101, 101, 0.1);
            border-radius: 10px;
            text-align: center;
            border: 2px solid rgba(245, 101, 101, 0.2);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 20px 25px;
                margin-bottom: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header h1 i {
                font-size: 28px;
            }

            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-number {
                font-size: 36px;
            }

            .chart-container {
                padding: 20px;
            }

            .chart-wrapper {
                height: 280px;
            }

            .filter-container {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .filter-group select {
                width: 100%;
            }

            .stat-details-content {
                padding: 25px;
                margin: 20px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .stats-cards {
                grid-template-columns: 1fr;
            }

            .stat-number {
                font-size: 32px;
            }

            .chart-wrapper {
                height: 250px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-chart-pie"></i> 数据统计</h1>
        <button class="btn btn-primary" onclick="window.location.href='/dashboard.html'">
            <i class="fas fa-arrow-left"></i> 返回仪表盘
        </button>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-cards">
        <div class="stat-card" onclick="showDetailModal('students')">
            <i class="fas fa-users stat-icon"></i>
            <div class="stat-number" id="totalStudents">0</div>
            <div class="stat-label">学生总数</div>
            <div class="stat-desc">包含普通学生、社长和教师</div>
            <div class="stat-extra">
                <div class="extra-item">
                    <span class="extra-label">普通学生:</span>
                    <span class="extra-value" id="regularStudentsCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">社长:</span>
                    <span class="extra-value" id="presidentsCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">教师:</span>
                    <span class="extra-value" id="teachersCount">0</span>
                </div>
            </div>
        </div>
        <div class="stat-card" onclick="showDetailModal('clubs')">
            <i class="fas fa-graduation-cap stat-icon"></i>
            <div class="stat-number" id="totalClubs">0</div>
            <div class="stat-label">社团总数</div>
            <div class="stat-desc">包含各类社团和学生组织</div>
            <div class="stat-extra">
                <div class="extra-item">
                    <span class="extra-label">文体类:</span>
                    <span class="extra-value" id="cultureClubsCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">学术类:</span>
                    <span class="extra-value" id="academicClubsCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">实践类:</span>
                    <span class="extra-value" id="practiceClubsCount">0</span>
                </div>
            </div>
        </div>
        <div class="stat-card" onclick="showDetailModal('activities')">
            <i class="fas fa-calendar-alt stat-icon"></i>
            <div class="stat-number" id="totalActivities">0</div>
            <div class="stat-label">活动总数</div>
            <div class="stat-desc">本学期所有活动</div>
            <div class="stat-extra">
                <div class="extra-item">
                    <span class="extra-label">已发布:</span>
                    <span class="extra-value" id="publishedActivitiesCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">进行中:</span>
                    <span class="extra-value" id="ongoingActivitiesCount">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">已结束:</span>
                    <span class="extra-value" id="endedActivitiesCount">0</span>
                </div>
            </div>
        </div>
        <div class="stat-card" onclick="showDetailModal('points')">
            <i class="fas fa-star stat-icon"></i>
            <div class="stat-number" id="totalPointsIssued">0</div>
            <div class="stat-label">发放积分总数</div>
            <div class="stat-desc">本学期发放的积分</div>
            <div class="stat-extra">
                <div class="extra-item">
                    <span class="extra-label">平均每人:</span>
                    <span class="extra-value" id="avgPointsPerStudent">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">最高积分:</span>
                    <span class="extra-value" id="maxPoints">0</span>
                </div>
                <div class="extra-item">
                    <span class="extra-label">0分学生:</span>
                    <span class="extra-value" id="zeroPointsStudents">0</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div class="stat-details" id="statDetails">
        <div class="stat-details-content">
            <div class="stat-details-header">
                <h3 class="stat-details-title" id="detailsTitle">详细信息</h3>
                <button class="close-btn" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="detailsContent">
                <!-- 详情内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 筛选条件 -->
    <div class="filter-container">
        <div class="filter-group">
            <label for="semesterFilter">学期筛选:</label>
            <select id="semesterFilter">
                <option value="all">全部学期</option>
                <option value="2023-1">2023年第一学期</option>
                <option value="2023-2">2023年第二学期</option>
                <option value="2024-1">2024年第一学期</option>
                <option value="2024-2">2024年第二学期</option>
                <option value="2025-1" selected>2025年第一学期</option>
                <option value="2025-2">2025年第二学期</option>
            </select>
        </div>
        <button class="refresh-btn" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i> 刷新数据
        </button>
    </div>

    <!-- 图表区域 -->
    <div class="chart-container">
        <div class="chart-header">
            <h3 class="chart-title">活动类型分布</h3>
        </div>
        <div class="chart-wrapper">
            <canvas id="activityTypeChart"></canvas>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-header">
            <h3 class="chart-title">社团活动数量</h3>
        </div>
        <div class="chart-wrapper">
            <canvas id="clubActivityChart"></canvas>
        </div>
    </div>


</div>

<script>
    let currentUser = null;
    let activityTypeChart = null;
    let clubActivityChart = null;
    let overviewData = {};
    let clubTypeCount = {};
    let activityTypeCount = {};
    let pointsDistribution = {};


    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM加载完成，开始初始化');
        checkLogin();
        
        // 初始化图表
        console.log('开始初始化图表...');
        initializeCharts();
        
        // 延迟加载数据，确保图表初始化完成
        setTimeout(() => {
            console.log('开始加载数据');
            refreshData();
        }, 1000); // 增加延迟时间，确保图表完全初始化
    });

    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            alert('请先登录');
            window.location.href = '/index.html';
            return;
        }

        if (user.role !== 'TEACHER') {
            alert('您没有权限访问此页面');
            window.location.href = '/dashboard.html';
            return;
        }

        currentUser = user;
    }

    // 初始化图表
    function initializeCharts() {
        console.log('初始化图表...');
        
        // 使用计数器确保Chart.js库已完全加载
        let attemptCount = 0;
        const maxAttempts = 10; // 最多尝试10次
        
        const tryInitialize = () => {
            attemptCount++;
            console.log(`初始化尝试 ${attemptCount}/${maxAttempts}`);
            
            // 检查Chart.js库是否加载
            if (typeof Chart === 'undefined') {
                console.log('Chart.js库未加载，等待重试...');
                if (attemptCount < maxAttempts) {
                    setTimeout(tryInitialize, 500); // 等待500ms后重试
                } else {
                    console.error('达到最大尝试次数，Chart.js库仍未加载');
                    // 强制初始化Canvas，不使用Chart.js
                    initializeCanvasOnly();
                }
                return;
            }
            
            // 检查Canvas元素是否存在
            const activityTypeCanvas = document.getElementById('activityTypeChart');
            const clubActivityCanvas = document.getElementById('clubActivityChart');
            
            if (!activityTypeCanvas || !clubActivityCanvas) {
                console.log('Canvas元素未找到，等待重试...');
                if (attemptCount < maxAttempts) {
                    setTimeout(tryInitialize, 500); // 等待500ms后重试
                } else {
                    console.error('达到最大尝试次数，Canvas元素仍未找到');
                    // 强制初始化Canvas，不使用Chart.js
                    initializeCanvasOnly();
                }
                return;
            }
            
            // 设置Canvas尺寸
            activityTypeCanvas.width = activityTypeCanvas.parentElement.clientWidth;
            activityTypeCanvas.height = 350;
            clubActivityCanvas.width = clubActivityCanvas.parentElement.clientWidth;
            clubActivityCanvas.height = 350;
            
            console.log('活动类型分布图Canvas尺寸:', activityTypeCanvas.width, 'x', activityTypeCanvas.height);
            console.log('社团活动数量图Canvas尺寸:', clubActivityCanvas.width, 'x', clubActivityCanvas.height);
            
            // 创建 Chart.js 饼图实例
            try {
                // 销毁已存在的图表实例
                if (activityTypeChart) {
                    try {
                        activityTypeChart.destroy();
                    } catch (e) {
                        console.error('销毁旧的活动类型分布图实例失败:', e);
                    }
                }
                
                // 创建新的图表实例
                const ctx = activityTypeCanvas.getContext('2d');
                activityTypeChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                '#667eea',
                                '#764ba2',
                                '#f093fb',
                                '#4facfe',
                                '#43e97b',
                                '#fa709a',
                                '#fee140',
                                '#30cfd0',
                                '#a8edea',
                                '#fed6e3'
                            ],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    padding: 15,
                                    font: {
                                        size: 12
                                    }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.parsed || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;

    // 绘制活动类型分布图（使用Canvas）
    function drawActivityTypeChart(data) {
        console.log('使用Canvas绘制活动类型分布图:', data);
        
        const canvas = document.getElementById('activityTypeChart');
        if (!canvas) {
            console.error('找不到活动类型分布图的Canvas元素');
            return;
        }
        
        const ctx = canvas.getContext('2d');
        if (!ctx) {
            console.error('无法获取Canvas上下文');
            return;
        }
        
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制标题
        ctx.fillStyle = '#667eea';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('活动类型分布', canvas.width / 2, 30);
        
        // 如果没有数据，显示提示
        if (!data || data.length === 0) {
            ctx.fillStyle = '#999';
            ctx.font = '16px Arial';
            ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            return;
        }
        
        // 计算总数量用于百分比计算
        const total = data.reduce((sum, item) => sum + (item.count || 0), 0);
        
        // 如果总数为0，显示提示
        if (total === 0) {
            ctx.fillStyle = '#999';
            ctx.font = '16px Arial';
            ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            return;
        }
        
        // 设置颜色数组
        const colors = [
            '#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b',
            '#fa709a', '#fee140', '#30cfd0', '#a8edea', '#fed6e3'
        ];
        
        // 绘制饼图
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 20;
        const radius = Math.min(canvas.width, canvas.height) / 3;
        
        let startAngle = -Math.PI / 2; // 从顶部开始
        
        data.forEach((item, index) => {
            const value = item.count || 0;
            const angle = (value / total) * 2 * Math.PI;
            const endAngle = startAngle + angle;
            
            // 绘制扇形
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[index % colors.length];
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            startAngle = endAngle;
        });
        
        // 绘制图例
        const legendX = canvas.width - 120;
        let legendY = 60;
        
        ctx.font = '12px Arial';
        ctx.textAlign = 'left';
        
        data.forEach((item, index) => {
            const color = colors[index % colors.length];
            const percentage = ((item.count || 0) / total * 100).toFixed(1);
            
            // 绘制颜色方块
            ctx.fillStyle = color;
            ctx.fillRect(legendX, legendY, 12, 12);
            
            // 绘制标签
            ctx.fillStyle = '#333';
            ctx.fillText(`${item.type} (${percentage}%)`, legendX + 20, legendY + 10);
            
            legendY += 20;
        });
        
        console.log('活动类型分布Canvas绘制完成');
    }

    // 绘制社团活动数量图（使用Canvas）
    function drawClubActivityChart(data) {
        console.log('使用Canvas绘制社团活动数量图:', data);
        
        const canvas = document.getElementById('clubActivityChart');
        if (!canvas) {
            console.error('找不到社团活动数量图的Canvas元素');
            return;
        }
        
        const ctx = canvas.getContext('2d');
        if (!ctx) {
            console.error('无法获取Canvas上下文');
            return;
        }
        
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制标题
        ctx.fillStyle = '#667eea';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('社团活动数量', canvas.width / 2, 30);
        
        // 如果没有数据，显示提示
        if (!data || data.length === 0) {
            ctx.fillStyle = '#999';
            ctx.font = '16px Arial';
            ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            return;
        }
        
        // 计算最大数量用于比例计算
        const maxValue = Math.max(...data.map(item => item.count || 0));
        
        // 如果最大值为0，显示提示
        if (maxValue === 0) {
            ctx.fillStyle = '#999';
            ctx.font = '16px Arial';
            ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            return;
        }
        
        // 设置绘制区域
        const chartArea = {
            left: 60,
            right: canvas.width - 20,
            top: 50,
            bottom: canvas.height - 60
        };
        
        const chartWidth = chartArea.right - chartArea.left;
        const chartHeight = chartArea.bottom - chartArea.top;
        const barCount = data.length;
        const barSpacing = chartWidth / (barCount + 1);
        const barWidth = Math.min(barSpacing * 0.7, 40);
        
        // 绘制坐标轴
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 1;
        
        // 绘制Y轴
        ctx.beginPath();
        ctx.moveTo(chartArea.left, chartArea.top);
        ctx.lineTo(chartArea.left, chartArea.bottom);
        ctx.stroke();
        
        // 绘制X轴
        ctx.beginPath();
        ctx.moveTo(chartArea.left, chartArea.bottom);
        ctx.lineTo(chartArea.right, chartArea.bottom);
        ctx.stroke();
        
        // 绘制Y轴刻度
        const yAxisStep = maxValue / 5;
        ctx.fillStyle = '#666';
        ctx.font = '11px Arial';
        ctx.textAlign = 'right';
        
        for (let i = 0; i <= 5; i++) {
            const y = chartArea.bottom - (chartHeight * i / 5);
            const value = Math.round(yAxisStep * i);
            
            // 绘制刻度线
            ctx.strokeStyle = '#eee';
            ctx.beginPath();
            ctx.moveTo(chartArea.left - 5, y);
            ctx.lineTo(chartArea.right, y);
            ctx.stroke();
            
            // 绘制刻度值
            ctx.fillText(value.toString(), chartArea.left - 10, y + 3);
        }
        
        // 绘制柱状图
        const color = '#667eea';
        const hoverColor = '#5568d3';
        
        data.forEach((item, index) => {
            const x = chartArea.left + barSpacing * (index + 0.5);
            const value = item.count || 0;
            const barHeight = (value / maxValue) * chartHeight;
            const y = chartArea.bottom - barHeight;
            
            // 绘制柱子
            ctx.fillStyle = color;
            ctx.fillRect(x - barWidth / 2, y, barWidth, barHeight);
            
            // 绘制柱子边框
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - barWidth / 2, y, barWidth, barHeight);
            
            // 绘制标签
            ctx.fillStyle = '#333';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            
            // 社团名称
            const clubName = (item.clubName || '未知社团').length > 10 
                ? (item.clubName || '未知社团').substring(0, 10) + '...' 
                : (item.clubName || '未知社团');
            
            ctx.fillText(clubName, x, chartArea.bottom + 15);
            
            // 数值
            ctx.font = 'bold 11px Arial';
            ctx.fillStyle = color;
            ctx.fillText(value.toString(), x, y - 5);
            ctx.font = '12px Arial';
        });
        
        console.log('社团活动数量Canvas绘制完成');
    }

        } catch (error) {
            console.error('加载活动类型分布错误:', error);
            // 设置空数据以避免图表显示旧数据
            if (activityTypeChart) {
                activityTypeChart.data.labels = [];
                activityTypeChart.data.datasets[0].data = [];
                activityTypeChart.update();
            }
            // 绘制错误提示到Canvas
            drawActivityTypeChartError(error.message);
        }
    }

    // 加载社团活动数量
    async function loadClubActivityCount(semester) {
        try {
            console.log('开始加载社团活动数量...');
            const params = new URLSearchParams();
            if (semester && semester !== 'all') params.append('semester', semester);

            console.log('请求参数:', params.toString());
            const response = await fetch(`/api/statistics/club-activities?${params}`);
            console.log('社团活动数量API响应状态:', response.status, response.statusText);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();
            console.log('社团活动数量API返回数据:', result);

            if (result.success) {
                const data = result.data || [];
                console.log('社团活动数量数据:', data);
                
                if (data.length === 0) {
                    console.log('没有社团活动数据');
                    // 设置空数据 - Chart.js图表
                    if (clubActivityChart) {
                        clubActivityChart.data.labels = [];
                        clubActivityChart.data.datasets[0].data = [];
                        clubActivityChart.update();
                        console.log('社团活动数量图已清空');
                    }
                    // 设置空数据 - Canvas备用图
                    drawClubActivityChart([]);
                    return;
                }
                
                const labels = data.map(item => item.clubName || '未知社团');
                const values = data.map(item => item.count || 0);
                
                // 存储社团活动数据供详情弹窗使用
                clubActivityCount = {};
                data.forEach(item => {
                    clubActivityCount[item.clubName] = item.count;
                });
                
                console.log('设置图表标签:', labels);
                console.log('设置图表数据:', values);

                // 确保图表对象存在 - Chart.js图表
                if (clubActivityChart) {
                    clubActivityChart.data.labels = labels;
                    clubActivityChart.data.datasets[0].data = values;
                    clubActivityChart.update();
                    console.log('社团活动数量图更新成功');
                } else {
                    console.log('社团活动图表对象不存在，使用备用Canvas绘制');
                }
                
                // 使用Canvas备用绘制
                drawClubActivityChart(data);
                
            } else {
                console.error('获取社团活动数量失败:', result.message);
                throw new Error(result.message || 'API返回失败');
            }
        } catch (error) {
            console.error('加载社团活动数量错误:', error);
            // 设置空数据以避免图表显示旧数据
            if (clubActivityChart) {
                clubActivityChart.data.labels = [];
                clubActivityChart.data.datasets[0].data = [];
                clubActivityChart.update();
            }
            // 绘制错误提示到Canvas
            drawClubActivityChartError(error.message);
        }
    }



    // 显示详情弹窗
    async function showDetailModal(type) {
        const modal = document.getElementById('statDetails');
        const title = document.getElementById('detailsTitle');
        const content = document.getElementById('detailsContent');
        
        // 根据类型设置标题和内容
        switch(type) {
            case 'students':
                title.textContent = '学生统计详情';
                
                // 加载学生数据
                try {
                    const studentsResponse = await fetch('/api/students');
                    const studentsResult = await studentsResponse.json();
                    
                    if (studentsResult.success && studentsResult.data) {
                        const students = studentsResult.data;
                        const regularStudents = students.filter(s => s.role === 'STUDENT');
                        const presidents = students.filter(s => s.role === 'PRESIDENT');
                        const teachers = students.filter(s => s.role === 'TEACHER');
                        
                        let studentsDetails = `
                            <div class="detail-item">
                                <span class="detail-label">普通学生数量</span>
                                <span class="detail-value">${regularStudents.length || 0}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">社长数量</span>
                                <span class="detail-value">${presidents.length || 0}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">教师数量</span>
                                <span class="detail-value">${teachers.length || 0}</span>
                            </div>
                            <div class="detail-section-title">活跃社长</div>
                            <div class="detail-list">
                        `;
                        
                        // 显示前5名社长及其社团信息
                        const topPresidents = presidents.slice(0, 5);
                        for (const president of topPresidents) {
                            // 获取社长管理的社团
                            try {
                                const clubsResponse = await fetch(`/api/clubs/by-president/${president.studentId}`);
                                const clubsResult = await clubsResponse.json();
                                
                                let clubNames = '无';
                                if (clubsResult.success && clubsResult.data && clubsResult.data.length > 0) {
                                    clubNames = clubsResult.data.map(c => c.clubName).join(', ');
                                }
                                
                                studentsDetails += `
                                    <div class="detail-list-item">
                                        <div class="item-name">${president.name || president.studentId}</div>
                                        <div class="item-desc">管理社团: ${clubNames}</div>
                                        <div class="item-stats">积分: ${president.totalPoints || 0}</div>
                                    </div>
                                `;
                            } catch (e) {
                                console.error('获取社长社团信息失败:', e);
                            }
                        }
                        
                        studentsDetails += `
                            </div>
                            <div class="detail-section-title">活跃学生</div>
                            <div class="detail-list">
                        `;
                        
                        // 显示积分最高的前5名学生
                        const topStudents = regularStudents
                            .sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0))
                            .slice(0, 5);
                        
                        for (const student of topStudents) {
                            studentsDetails += `
                                <div class="detail-list-item">
                                    <div class="item-name">${student.name || student.studentId}</div>
                                    <div class="item-desc">学号: ${student.studentId || '未知'}</div>
                                    <div class="item-stats">积分: ${student.totalPoints || 0}</div>
                                </div>
                            `;
                        }
                        
                        studentsDetails += `</div>`;
                        content.innerHTML = studentsDetails;
                    } else {
                        content.innerHTML = `<div class="error-message">加载学生数据失败</div>`;
                    }
                } catch (error) {
                    console.error('加载学生详情错误:', error);
                    content.innerHTML = `<div class="error-message">加载学生详情失败: ${error.message}</div>`;
                }
                break;
            case 'clubs':
                title.textContent = '社团统计详情';
                
                // 加载社团数据
                try {
                    const clubsResponse = await fetch('/api/clubs');
                    const clubsResult = await clubsResponse.json();
                    
                    if (clubsResult.success && clubsResult.data) {
                        const clubs = clubsResult.data;
                        
                        let clubDetails = `
                            <div class="detail-item">
                                <span class="detail-label">社团总数</span>
                                <span class="detail-value">${clubs.length || 0}</span>
                            </div>
                        `;
                        
                        // 按类型统计社团
                        const typeCount = {};
                        clubs.forEach(club => {
                            const type = club.clubType || '未分类';
                            typeCount[type] = (typeCount[type] || 0) + 1;
                        });
                        
                        // 显示各类型社团数量
                        for (const [type, count] of Object.entries(typeCount)) {
                            clubDetails += `
                                <div class="detail-item">
                                    <span class="detail-label">${type}社团</span>
                                    <span class="detail-value">${count}</span>
                                </div>
                            `;
                        }
                        
                        // 显示活跃社团
                        clubDetails += `
                            <div class="detail-section-title">活跃社团</div>
                            <div class="detail-list">
                        `;
                        
                        // 按活动数量排序，显示前5名社团
                        const clubActivityCounts = await Promise.all(
                            clubs.map(async club => {
                                try {
                                    const activitiesResponse = await fetch(`/api/activities/club/${club.clubId}`);
                                    const activitiesResult = await activitiesResponse.json();
                                    const activityCount = activitiesResult.success ? (activitiesResult.data || []).length : 0;
                                    return { ...club, activityCount };
                                } catch (e) {
                                    return { ...club, activityCount: 0 };
                                }
                            })
                        );
                        
                        const topClubs = clubActivityCounts
                            .sort((a, b) => b.activityCount - a.activityCount)
                            .slice(0, 5);
                        
                        for (const club of topClubs) {
                            clubDetails += `
                                <div class="detail-list-item">
                                    <div class="item-name">${club.clubName}</div>
                                    <div class="item-desc">类型: ${club.clubType || '未分类'}</div>
                                    <div class="item-stats">活动数: ${club.activityCount}</div>
                                </div>
                            `;
                        }
                        
                        clubDetails += `</div>`;
                        content.innerHTML = clubDetails;
                    } else {
                        content.innerHTML = `<div class="error-message">加载社团数据失败</div>`;
                    }
                } catch (error) {
                    console.error('加载社团详情错误:', error);
                    content.innerHTML = `<div class="error-message">加载社团详情失败: ${error.message}</div>`;
                }
                break;
            case 'activities':
                title.textContent = '活动统计详情';
                
                // 加载活动数据
                try {
                    const activitiesResponse = await fetch('/api/activities');
                    const activitiesResult = await activitiesResponse.json();
                    
                    if (activitiesResult.success && activitiesResult.data) {
                        const activities = activitiesResult.data;
                        
                        let activityDetails = `
                            <div class="detail-item">
                                <span class="detail-label">活动总数</span>
                                <span class="detail-value">${activities.length || 0}</span>
                            </div>
                        `;
                        
                        // 按状态统计活动
                        const statusCount = {};
                        activities.forEach(activity => {
                            const status = activity.status || 'UNKNOWN';
                            statusCount[status] = (statusCount[status] || 0) + 1;
                        });
                        
                        // 显示各状态活动数量
                        for (const [status, count] of Object.entries(statusCount)) {
                            let statusLabel = status;
                            if (status === 'PUBLISHED') statusLabel = '已发布';
                            else if (status === 'ONGOING') statusLabel = '进行中';
                            else if (status === 'ENDED') statusLabel = '已结束';
                            else if (status === 'DRAFT') statusLabel = '草稿';
                            
                            activityDetails += `
                                <div class="detail-item">
                                    <span class="detail-label">${statusLabel}</span>
                                    <span class="detail-value">${count}</span>
                                </div>
                            `;
                        }
                        
                        // 按类型统计活动
                        const typeCount = {};
                        activities.forEach(activity => {
                            const type = activity.activityType || '未分类';
                            typeCount[type] = (typeCount[type] || 0) + 1;
                        });
                        
                        // 显示各类型活动数量
                        for (const [type, count] of Object.entries(typeCount)) {
                            activityDetails += `
                                <div class="detail-item">
                                    <span class="detail-label">${type}</span>
                                    <span class="detail-value">${count}</span>
                                </div>
                            `;
                        }
                        
                        // 显示热门活动
                        activityDetails += `
                            <div class="detail-section-title">热门活动</div>
                            <div class="detail-list">
                        `;
                        
                        // 按参与人数排序，显示前5名活动
                        const topActivities = await Promise.all(
                            activities.map(async activity => {
                                try {
                                    const participantsResponse = await fetch(`/api/activities/${activity.activityId}/participants`);
                                    const participantsResult = await participantsResponse.json();
                                    const participantCount = participantsResult.success ? (participantsResult.data || 0) : 0;
                                    return { ...activity, participantCount };
                                } catch (e) {
                                    return { ...activity, participantCount: 0 };
                                }
                            })
                        );
                        
                        const popularActivities = topActivities
                            .sort((a, b) => b.participantCount - a.participantCount)
                            .slice(0, 5);
                        
                        for (const activity of popularActivities) {
                            // 获取社团名称
                            let clubName = '未知社团';
                            try {
                                const clubResponse = await fetch(`/api/clubs/${activity.clubId}`);
                                const clubResult = await clubResponse.json();
                                if (clubResult.success && clubResult.data) {
                                    clubName = clubResult.data.clubName;
                                }
                            } catch (e) {
                                console.error('获取社团名称失败:', e);
                            }
                            
                            activityDetails += `
                                <div class="detail-list-item">
                                    <div class="item-name">${activity.activityName}</div>
                                    <div class="item-desc">社团: ${clubName}</div>
                                    <div class="item-stats">参与人数: ${activity.participantCount}/${activity.maxParticipants || '不限'}</div>
                                </div>
                            `;
                        }
                        
                        activityDetails += `</div>`;
                        content.innerHTML = activityDetails;
                    } else {
                        content.innerHTML = `<div class="error-message">加载活动数据失败</div>`;
                    }
                } catch (error) {
                    console.error('加载活动详情错误:', error);
                    content.innerHTML = `<div class="error-message">加载活动详情失败: ${error.message}</div>`;
                }
                break;
            case 'points':
                title.textContent = '积分统计详情';
                
                // 加载积分数据
                try {
                    const pointsResponse = await fetch('/api/statistics/points');
                    const pointsResult = await pointsResponse.json();
                    
                    if (pointsResult.success && pointsResult.data) {
                        const pointsData = pointsResult.data;
                        
                        let pointsDetails = `
                            <div class="detail-item">
                                <span class="detail-label">积分发放总量</span>
                                <span class="detail-value">${pointsData.totalPointsEarned || 0}</span>
                            </div>
                        `;
                        
                        // 显示各积分段学生分布
                        if (pointsData.pointsDistribution) {
                            for (const [range, count] of Object.entries(pointsData.pointsDistribution)) {
                                let rangeLabel = range;
                                if (range === '0') rangeLabel = '0积分学生';
                                else if (range === '1-10') rangeLabel = '1-10积分学生';
                                else if (range === '11-50') rangeLabel = '11-50积分学生';
                                else if (range === '51-100') rangeLabel = '51-100积分学生';
                                else if (range === '100+') rangeLabel = '100+积分学生';
                                
                                pointsDetails += `
                                    <div class="detail-item">
                                        <span class="detail-label">${rangeLabel}</span>
                                        <span class="detail-value">${count}</span>
                                    </div>
                                `;
                            }
                        }
                        
                        // 显示积分排行榜
                        pointsDetails += `
                            <div class="detail-section-title">积分排行榜</div>
                            <div class="detail-list">
                        `;
                        
                        // 加载学生数据并按积分排序
                        try {
                            const studentsResponse = await fetch('/api/students');
                            const studentsResult = await studentsResponse.json();
                            
                            if (studentsResult.success && studentsResult.data) {
                                const topStudents = studentsResult.data
                                    .sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0))
                                    .slice(0, 5);
                                
                                for (let i = 0; i < topStudents.length; i++) {
                                    const student = topStudents[i];
                                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
                                    
                                    pointsDetails += `
                                        <div class="detail-list-item">
                                            <div class="item-name">${medal} ${student.name || student.studentId}</div>
                                            <div class="item-desc">学号: ${student.studentId || '未知'}</div>
                                            <div class="item-stats">总积分: ${student.totalPoints || 0}</div>
                                        </div>
                                    `;
                                }
                            }
                        } catch (e) {
                            console.error('获取学生积分排行榜失败:', e);
                            pointsDetails += `<div class="error-message">获取积分排行榜失败</div>`;
                        }
                        
                        pointsDetails += `</div>`;
                        content.innerHTML = pointsDetails;
                    } else {
                        content.innerHTML = `<div class="error-message">加载积分数据失败</div>`;
                    }
                } catch (error) {
                    console.error('加载积分详情错误:', error);
                    content.innerHTML = `<div class="error-message">加载积分详情失败: ${error.message}</div>`;
                }
                break;
        }
        
        // 显示弹窗
        modal.style.display = 'flex';
    }
    
    // 关闭详情弹窗
    function closeDetailModal() {
        document.getElementById('statDetails').style.display = 'none';
    }
    
    // 显示提示消息
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
            <span>${message}</span>
        `;

        document.body.appendChild(toast);

        // 显示提示
        setTimeout(() => {
            toast.classList.add('show');
        }, 100);

        // 3秒后隐藏
        setTimeout(() => {
            toast.classList.remove('show');

            // 动画结束后移除元素
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 300);
        }, 3000);
    }
</script>
