<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团活动管理系统 - 登录</title>
    <!-- Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- 直接内联所有CSS样式，确保本地打开也能显示 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-attachment: fixed;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰元素 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        body::before {
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        body::after {
            bottom: -100px;
            right: -100px;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        /* 中间装饰元素 */
        .floating-element {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .floating-element:nth-child(2) {
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }

        .floating-element:nth-child(3) {
            top: 50%;
            left: 10%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(4) {
            bottom: 30%;
            right: 10%;
            animation-delay: 5s;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .system-info {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .system-info .logo {
            font-size: 60px;
            margin-bottom: 20px;
            color: #667eea;
            display: block;
            transition: transform 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
            text-align: center;
        }
        
        .system-info .logo i {
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            display: inline-block;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .system-info .logo:hover {
            transform: scale(1.15);
            animation-play-state: paused;
        }

        .system-info h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .system-info p {
            color: #666;
            font-size: 14px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .role-selector {
            display: flex;
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            background: #f8f9fa;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .role-option {
            flex: 1;
            padding: 15px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        .role-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.3s ease;
        }
        
        .role-option:hover::before {
            left: 100%;
        }

        .role-option.active {
            background: linear-gradient(135deg, #667eea 0%, #5a6fd8 100%);
            color: white;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .role-option:not(.active):hover {
            background: #e9ecef;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            transform: translateY(-1px);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 45px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
            font-size: 16px;
        }
        
        .password-toggle:hover {
            color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 15px;
            font-weight: 600;
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4092 100%);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.6);
            transform: translateY(-3px);
        }

        .login-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .login-btn:disabled::before {
            display: none;
        }

        .role-description {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .role-description:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .role-description strong {
            color: #333;
        }

        .login-footer {
            text-align: center;
            margin-top: 35px;
            font-size: 14px;
            color: #999;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .login-footer::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        /* 移除测试账号样式 */

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .success-message {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 4px 15px rgba(21, 87, 36, 0.1);
            border-left: 5px solid #28a745;
            animation: slideIn 0.3s ease-out;
        }

        .error-message-global {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 4px 15px rgba(114, 28, 36, 0.1);
            border-left: 5px solid #dc3545;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
                margin: 15px;
            }

            body::before, body::after {
                width: 200px;
                height: 200px;
            }

            .floating-element {
                width: 80px;
                height: 80px;
            }

            .role-selector {
                flex-direction: column;
            }

            .role-option {
                padding: 15px;
            }

            .login-header h1 {
                font-size: 28px;
            }

            .system-info .logo {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
<!-- 浮动装饰元素 -->
<div class="floating-element"></div>
<div class="floating-element"></div>
<div class="floating-element"></div>
<div class="floating-element"></div>

<!-- 登录容器 -->
<div class="login-container">
    <div class="system-info">
            <div class="logo">🎓</div>
        <h2>社团活动管理系统</h2>
        <p>基于Spring Boot的学生社团管理平台</p>
    </div>

    <div class="login-header">
        <h1>用户登录</h1>
        <p>请选择您的身份并输入登录信息</p>
    </div>

    <div class="role-selector">
        <button type="button" class="role-option active" data-role="STUDENT">学生</button>
        <button type="button" class="role-option" data-role="PRESIDENT">社长</button>
        <button type="button" class="role-option" data-role="TEACHER">团委老师</button>
        <button type="button" class="role-option" data-role="ADMIN">系统管理员</button>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">学号/工号</label>
            <input type="text" id="username" placeholder="请输入学号或工号" required>
            <div class="error-message" id="usernameError">请输入有效的学号/工号</div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
            <span class="password-toggle" id="passwordToggle">👁️</span>
            <div class="error-message" id="passwordError">请输入密码</div>
        </div>

        <button type="submit" class="login-btn">登录系统</button>
    </form>

    <div class="role-description" id="roleDesc">
        <strong>学生权限：</strong>浏览活动、报名参与、扫码签到、查询积分
    </div>

    <div class="login-footer">
        <p>© 2024 康东工业大学 - 社团活动管理系统</p>
    </div>
</div>

<script>
    // 直接内联所有JavaScript代码
    document.addEventListener('DOMContentLoaded', function() {
        const roleOptions = document.querySelectorAll('.role-option');
        const roleDesc = document.getElementById('roleDesc');
        const loginForm = document.getElementById('loginForm');
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        const roleDescriptions = {
            STUDENT: '<strong>学生权限：</strong>浏览活动、报名参与、扫码签到、查询积分',
            PRESIDENT: '<strong>社长权限：</strong>创建活动、生成签到码、管理本社活动、查看统计数据',
            TEACHER: '<strong>团委老师权限：</strong>审批活动、制订积分规则、查看全局数据、管理社团',
            ADMIN: '<strong>系统管理员权限：</strong>管理所有用户、活动和社团，系统配置和维护'
        };

        // 角色选择功能
        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                const role = this.getAttribute('data-role');
                roleDesc.innerHTML = roleDescriptions[role];

                if (role === 'TEACHER') {
                    usernameInput.placeholder = "请输入工号";
                } else {
                    usernameInput.placeholder = "请输入学号";
                }
            });
        });

        // 密码显示/隐藏功能
        passwordToggle.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                this.textContent = '👁️';
            }
        });

        // 表单验证功能
        function validateForm() {
            let isValid = true;

            if (!usernameInput.value.trim()) {
                usernameError.style.display = 'block';
                usernameInput.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                usernameError.style.display = 'none';
                usernameInput.style.borderColor = '#ddd';
            }

            if (!passwordInput.value.trim()) {
                passwordError.style.display = 'block';
                passwordInput.style.borderColor = '#e74c3c';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                passwordInput.style.borderColor = '#ddd';
            }

            return isValid;
        }

        // 显示全局消息
        function showMessage(message, isSuccess = true) {
            // 移除现有消息
            const existingMessage = document.querySelector('.success-message, .error-message-global');
            if (existingMessage) {
                existingMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = isSuccess ? 'success-message' : 'error-message-global';
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';

            loginForm.parentNode.insertBefore(messageDiv, loginForm);

            // 5秒后自动消失
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.style.display = 'none';
                }
            }, 5000);
        }

        // 表单提交处理
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (validateForm()) {
                const username = usernameInput.value;
                const password = passwordInput.value;
                const selectedRole = document.querySelector('.role-option.active').getAttribute('data-role');

                // 显示加载状态
                const loginBtn = document.querySelector('.login-btn');
                const originalText = loginBtn.textContent;
                loginBtn.textContent = '登录中...';
                loginBtn.disabled = true;
                loginForm.classList.add('loading');

                try {
                    // 向后端发送登录请求
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password,
                            role: selectedRole
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage('✅ ' + result.message, true);

                        // 保存token和用户信息到localStorage
                        localStorage.setItem('token', result.data.token);
                        localStorage.setItem('user', JSON.stringify(result.data.user));

                        // 根据角色跳转到不同页面
                        setTimeout(() => {
                            if (result.data.user.role === 'ADMIN') {
                                window.location.href = '/admin-dashboard.html';
                            } else {
                                window.location.href = '/dashboard.html';
                            }
                        }, 1500);

                    } else {
                        showMessage('❌ ' + result.message, false);
                    }
                } catch (error) {
                    console.error('登录错误:', error);
                    showMessage('❌ 登录过程中发生错误，请检查网络连接', false);
                } finally {
                    // 重置按钮状态
                    loginBtn.textContent = originalText;
                    loginBtn.disabled = false;
                    loginForm.classList.remove('loading');
                }
            }
        });

        // 输入时实时验证
        usernameInput.addEventListener('input', function() {
            if (this.value.trim()) {
                usernameError.style.display = 'none';
                this.style.borderColor = '#ddd';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.trim()) {
                passwordError.style.display = 'none';
                this.style.borderColor = '#ddd';
            }
        });

        // 测试后端连接
        async function testBackendConnection() {
            try {
                const response = await fetch('/api/auth/test');
                const result = await response.json();
                console.log('后端连接测试:', result);
            } catch (error) {
                console.error('后端连接失败:', error);
            }
        }

        // 页面加载时测试连接
        testBackendConnection();
    });
</script>
</body>
</html>
