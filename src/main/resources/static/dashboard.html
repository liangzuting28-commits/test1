<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .logo h2 {
            color: #667eea;
            font-size: 22px;
        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #555;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: #667eea;
            color: white;
        }

        .nav-link.active {
            background: #667eea;
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-right: 15px;
        }

        .user-details h2 {
            color: #333;
            margin-bottom: 5px;
        }

        .user-details p {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .stat-card:nth-child(1) .stat-icon { background: #4CAF50; }
        .stat-card:nth-child(2) .stat-icon { background: #2196F3; }
        .stat-card:nth-child(3) .stat-icon { background: #FF9800; }
        .stat-card:nth-child(4) .stat-icon { background: #9C27B0; }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        /* 功能网格 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .feature-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .feature-card h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-card h3 i {
            color: #667eea;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-list li i {
            color: #4CAF50;
            font-size: 12px;
        }

        /* 快速操作卡片 */
        .quick-actions {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .quick-actions h3 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8f9fa;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .action-btn i {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .action-btn span {
            font-size: 14px;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                order: 2;
            }

            .main-content {
                order: 1;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .user-info {
                flex-direction: column;
                text-align: center;
            }

            .user-avatar {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .action-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .action-buttons {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="logo">
            <h2>社团管理系统</h2>
            <p>基于Spring Boot的管理平台</p>
        </div>
        <ul class="nav-menu" id="navMenu">
            <!-- 导航菜单将通过JavaScript动态生成 -->
        </ul>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <h2 id="welcomeTitle">欢迎回来！</h2>
                    <div id="userInfo">
                        <!-- 用户信息将通过JavaScript填充 -->
                    </div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                退出登录
            </button>
        </div>

        <!-- 快速操作 -->
        <div class="quick-actions" id="quickActions">
            <h3><i class="fas fa-bolt"></i> 快速操作</h3>
            <div class="action-buttons" id="actionButtons">
                <!-- 快速操作按钮将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsGrid">
            <!-- 统计卡片将通过JavaScript动态生成 -->
        </div>

        <!-- 功能网格 -->
        <div class="features-grid" id="featuresGrid">
            <!-- 功能卡片将通过JavaScript动态生成 -->
        </div>
    </div>
</div>

<script>
    // 全局变量
    let currentUser = null;

    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        initDashboard();
    });

    // 检查登录状态
    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            alert('请先登录');
            window.location.href = '/index.html';
            return;
        }

        currentUser = user;
    }

    // 显示欢迎信息
    function displayUserInfo() {
        document.getElementById('welcomeTitle').textContent = `欢迎回来，${currentUser.name || currentUser.username}！`;
        document.getElementById('userInfo').innerHTML = `
                <p><strong>角色：</strong>${getRoleName(currentUser.role)}</p>
                <p><strong>用户名：</strong>${currentUser.username}</p>
                ${currentUser.studentId ? `<p><strong>学号/工号：</strong>${currentUser.studentId}</p>` : ''}
                ${currentUser.clubId ? `<p><strong>社团ID：</strong>${currentUser.clubId}</p>` : ''}
            `;
    }

    // 角色名称映射
    function getRoleName(role) {
        const roleMap = {
            'STUDENT': '学生',
            'PRESIDENT': '社长',
            'TEACHER': '团委老师'
        };
        return roleMap[role] || role;
    }

    // 根据角色生成导航菜单
    function generateNavMenu() {
        const navMenu = document.getElementById('navMenu');
        let menuItems = [];

        switch(currentUser.role) {
            case 'STUDENT':
                menuItems = [
                    { icon: 'fas fa-home', text: '仪表盘', active: true, href: '/dashboard.html' },
                    { icon: 'fas fa-calendar-alt', text: '活动中心', href: '/activity-center.html' },
                    { icon: 'fas fa-tasks', text: '我的活动', href: '/my-activities.html' },
                    { icon: 'fas fa-star', text: '我的积分', href: '/my-points.html' },
                    { icon: 'fas fa-qrcode', text: '扫码签到', href: '/checkin.html' },
                    { icon: 'fas fa-users', text: '社团中心', href: '/club-manage.html' }
                ];
                break;
            case 'PRESIDENT':
                menuItems = [
                    { icon: 'fas fa-home', text: '仪表盘', active: true, href: '/dashboard.html' },
                    { icon: 'fas fa-plus-circle', text: '创建活动', href: '/create-activity.html' },
                    { icon: 'fas fa-calendar', text: '活动管理', href: '/manage-activities.html' },
                    { icon: 'fas fa-users', text: '社团管理', href: '/club-manage.html' },
                    { icon: 'fas fa-users-cog', text: '成员管理', href: '/member-management.html' },
                    { icon: 'fas fa-qrcode', text: '签到管理', href: '/checkin-manage.html' }
                ];
                break;
            case 'TEACHER':
                menuItems = [
                    { icon: 'fas fa-home', text: '仪表盘', active: true, href: '/dashboard.html' },
                    { icon: 'fas fa-clipboard-check', text: '活动审核', href: '/activity-review.html' },
                    { icon: 'fas fa-cog', text: '积分规则', href: '/points-rules.html' },
                    { icon: 'fas fa-school', text: '社团管理', href: '/club-manage.html' },
                    { icon: 'fas fa-chart-pie', text: '数据统计', href: '/global-statistics-simple.html' }
                ];
                break;
        }

        navMenu.innerHTML = menuItems.map(item => `
                <li class="nav-item">
                    <a href="${item.href}" class="nav-link ${item.active ? 'active' : ''}">
                        <i class="${item.icon}"></i>
                        ${item.text}
                    </a>
                </li>
            `).join('');
    }

    // 根据角色生成快速操作按钮
    function generateQuickActions() {
        const actionButtons = document.getElementById('actionButtons');
        let actions = [];

        switch(currentUser.role) {
            case 'STUDENT':
                actions = [
                    { icon: 'fas fa-calendar-plus', text: '浏览活动', href: '/activity-center.html' },
                    { icon: 'fas fa-tasks', text: '我的报名', href: '/my-activities.html' },
                    { icon: 'fas fa-star', text: '积分查询', href: '/my-points.html' },
                    { icon: 'fas fa-qrcode', text: '扫码签到', href: '/checkin.html' },
                    { icon: 'fas fa-users', text: '社团中心', href: '/club-manage.html' }
                ];
                break;
            case 'PRESIDENT':
                actions = [
                    { icon: 'fas fa-plus-circle', text: '创建活动', href: '/create-activity.html' },
                    { icon: 'fas fa-calendar-check', text: '活动管理', href: '/manage-activities.html' },
                    { icon: 'fas fa-users', text: '管理社团', href: '/club-manage.html' },
                    { icon: 'fas fa-users-cog', text: '成员管理', href: '/member-manage.html' },
                    { icon: 'fas fa-qrcode', text: '生成签到码', href: '/checkin-manage.html' }
                ];
                break;
            case 'TEACHER':
                actions = [
                    { icon: 'fas fa-clipboard-check', text: '活动审核', href: '/activity-review.html' },
                    { icon: 'fas fa-cog', text: '积分规则', href: '/points-rules.html' },
                    { icon: 'fas fa-school', text: '社团管理', href: '/club-manage.html' },
                    { icon: 'fas fa-chart-pie', text: '数据统计', href: '/global-statistics-simple.html' }
                ];
                break;
        }

        actionButtons.innerHTML = actions.map(action => `
                <a href="${action.href}" class="action-btn">
                    <i class="${action.icon}"></i>
                    <span>${action.text}</span>
                </a>
            `).join('');
    }

    // 根据角色生成统计卡片
    function generateStatsCards() {
        const statsGrid = document.getElementById('statsGrid');
        let stats = [];

        switch(currentUser.role) {
            case 'STUDENT':
                stats = [
                    { icon: 'fas fa-calendar-check', number: '12', label: '参与活动数' },
                    { icon: 'fas fa-star', number: '86', label: '当前积分' },
                    { icon: 'fas fa-trophy', number: '3', label: '本月排名' },
                    { icon: 'fas fa-clock', number: '24', label: '待签到活动' }
                ];
                break;
            case 'PRESIDENT':
                stats = [
                    { icon: 'fas fa-calendar', number: '8', label: '本月活动数' },
                    { icon: 'fas fa-users', number: '45', label: '社团成员数' },
                    { icon: 'fas fa-chart-line', number: '78%', label: '活动参与率' },
                    { icon: 'fas fa-check-circle', number: '5', label: '待审批活动' }
                ];
                break;
            case 'TEACHER':
                stats = [
                    { icon: 'fas fa-school', number: '23', label: '注册社团数' },
                    { icon: 'fas fa-calendar', number: '156', label: '年度活动数' },
                    { icon: 'fas fa-user-graduate', number: '1,234', label: '活跃学生数' },
                    { icon: 'fas fa-clipboard-list', number: '12', label: '待审批申请' }
                ];
                break;
        }

        statsGrid.innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="${stat.icon}"></i>
                    </div>
                    <div class="stat-number">${stat.number}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
    }

    // 根据角色生成功能卡片
    function generateFeatureCards() {
        const featuresGrid = document.getElementById('featuresGrid');
        let features = [];

        switch(currentUser.role) {
            case 'STUDENT':
                features = [
                    {
                        title: '<i class="fas fa-calendar-alt"></i>活动管理',
                        items: ['浏览所有活动', '报名参与活动', '查看活动详情', '活动收藏']
                    },
                    {
                        title: '<i class="fas fa-user"></i>个人中心',
                        items: ['查看个人积分', '查询活动记录', '修改个人信息', '积分明细查询']
                    },
                    {
                        title: '<i class="fas fa-users"></i>社团中心',
                        items: ['浏览所有社团', '申请加入社团', '查看社团活动', '社团成员互动']
                    }
                ];
                break;
            case 'PRESIDENT':
                features = [
                    {
                        title: '<i class="fas fa-calendar-plus"></i>活动管理',
                        items: ['创建新活动', '管理本社活动', '活动审批查询', '活动状态跟踪']
                    },
                    {
                        title: '<i class="fas fa-users"></i>社团管理',
                        items: ['管理社团成员', '查看社团数据', '成员权限设置']
                    }
                ];
                break;
            case 'TEACHER':
                features = [
                    {
                        title: '<i class="fas fa-clipboard-check"></i>活动审核',
                        items: ['审核活动申请', '查看审核记录', '活动监督管理', '违规处理']
                    },
                    {
                        title: '<i class="fas fa-cog"></i>系统管理',
                        items: ['管理积分规则', '系统参数设置', '用户权限管理', '数据备份']
                    },
                    {
                        title: '<i class="fas fa-school"></i>社团管理',
                        items: ['管理所有社团', '审核社团申请', '监督社团活动', '社团数据统计']
                    }
                ];
                break;
        }

        featuresGrid.innerHTML = features.map(feature => `
                <div class="feature-card">
                    <h3>${feature.title}</h3>
                    <ul class="feature-list">
                        ${feature.items.map(item => `
                            <li><i class="fas fa-check"></i>${item}</li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
    }

    // 初始化仪表盘
    function initDashboard() {
        displayUserInfo();
        generateNavMenu();
        generateQuickActions();
        generateStatsCards();
        generateFeatureCards();

        // 加载实时数据
        loadRealTimeData();
    }

    // 加载实时数据
    async function loadRealTimeData() {
        try {
            // 如果是社长，加载活动统计
            if (currentUser.role === 'PRESIDENT') {
                const response = await fetch('/api/activity-manage/my-activities', {
                    headers: {
                        'X-User-Id': currentUser.studentId
                    }
                });
                const result = await response.json();

                if (result.success) {
                    const activities = result.data;
                    const pendingCount = activities.filter(a => a.status === 'PENDING').length;
                    const publishedCount = activities.filter(a => a.status === 'PUBLISHED').length;
                    const rejectedCount = activities.filter(a => a.status === 'REJECTED').length;

                    // 更新统计卡片
                    document.querySelectorAll('.stat-number')[0].textContent = activities.length;
                    document.querySelectorAll('.stat-number')[1].textContent = pendingCount;
                    document.querySelectorAll('.stat-number')[2].textContent = publishedCount;
                    document.querySelectorAll('.stat-number')[3].textContent = rejectedCount;
                }

                // 加载社团统计
                const clubsResponse = await fetch('/api/clubs/my-clubs', {
                    headers: {
                        'X-User-Id': currentUser.studentId
                    }
                });
                const clubsResult = await clubsResponse.json();

                if (clubsResult.success) {
                    document.querySelectorAll('.stat-number')[1].textContent = clubsResult.data.length;
                }
            }

            // 如果是学生，加载个人数据
            if (currentUser.role === 'STUDENT') {
                // 加载总积分
                const pointsResponse = await fetch(`/api/points/student/${currentUser.studentId}/total`);
                const pointsResult = await pointsResponse.json();

                if (pointsResult.success) {
                    document.querySelectorAll('.stat-number')[1].textContent = pointsResult.data;
                }

                // 加载活动记录数
                const activitiesResponse = await fetch(`/api/activities/my-registrations`, {
                    headers: {
                        'X-User-Id': currentUser.studentId
                    }
                });
                const activitiesResult = await activitiesResponse.json();

                if (activitiesResult.success) {
                    document.querySelectorAll('.stat-number')[0].textContent = activitiesResult.data.length;
                }
            }

            // 如果是老师，加载系统数据
            if (currentUser.role === 'TEACHER') {
                // 加载社团总数
                const clubsResponse = await fetch('/api/clubs');
                const clubsResult = await clubsResponse.json();

                if (clubsResult.success) {
                    document.querySelectorAll('.stat-number')[0].textContent = clubsResult.data.length;
                }

                // 加载待审核活动
                const pendingResponse = await fetch('/api/activity-manage/pending');
                const pendingResult = await pendingResponse.json();

                if (pendingResult.success) {
                    document.querySelectorAll('.stat-number')[3].textContent = pendingResult.data.length;
                }

                // 加载统计概览数据，包括活跃学生数和年度活动数
                const overviewResponse = await fetch('/api/statistics/overview');
                const overviewResult = await overviewResponse.json();

                if (overviewResult.success) {
                    const data = overviewResult.data;
                    // 更新年度活动数（索引1）
                    document.querySelectorAll('.stat-number')[1].textContent = data.activityCount;
                    // 更新活跃学生数（索引2）
                    document.querySelectorAll('.stat-number')[2].textContent = data.activeStudentCount;
                }
            }
        } catch (error) {
            console.error('加载实时数据失败:', error);
        }
    }

    // 退出登录
    function logout() {
        if (confirm('确定要退出登录吗？')) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/index.html';
        }
    }
</script>
