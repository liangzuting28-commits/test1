<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表盘 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --student-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --teacher-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --success-gradient: linear-gradient(135deg, #4ade80 0%, #10b981 100%);
            --warning-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            --sidebar-bg: rgba(255, 255, 255, 0.97);
            --card-bg: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #999;
            --border-color: #eee;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 20px;
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(15px);
            padding: 24px 0;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            position: sticky;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar:hover {
            box-shadow: var(--shadow-lg);
        }

        .logo {
            text-align: center;
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .logo h2 {
            color: #667eea;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 400;
        }

        .nav-menu {
            list-style: none;
            padding: 0 20px;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: var(--border-radius-md);
            transition: var(--transition);
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-gradient);
            transform: scaleY(0);
            transition: var(--transition);
            border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            color: #667eea;
            transform: translateX(4px);
        }

        .nav-link:hover::before {
            transform: scaleY(1);
        }

        .nav-link.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .nav-link.active::before {
            transform: scaleY(1);
        }

        .nav-link i {
            margin-right: 12px;
            width: 22px;
            text-align: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .nav-link:hover i {
            transform: scale(1.1);
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
        }

        /* 自定义滚动条 */
        .main-content::-webkit-scrollbar {
            width: 8px;
        }

        .main-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .main-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .header {
            background: var(--card-bg);
            border-radius: var(--border-radius-xl);
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .header:hover {
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(102, 126, 234, 0.05);
            padding: 10px 16px;
            border-radius: var(--border-radius-md);
            transition: var(--transition);
        }

        .user-info:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .user-info i {
            font-size: 28px;
            color: #667eea;
        }

        /* 统计卡片样式 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-xl);
            padding: 30px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-xl);
        }

        .stat-icon {
            font-size: 48px;
            padding: 20px;
            border-radius: 50%;
            margin-right: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .stat-icon::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
            transition: var(--transition);
        }

        .stat-card:hover .stat-icon::after {
            opacity: 0.5;
            transform: scale(1.2);
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .stat-icon.total-users {
            background: var(--primary-gradient);
            color: white;
        }

        .stat-icon.total-activities {
            background: var(--secondary-gradient);
            color: white;
        }

        .stat-icon.student-users {
            background: var(--student-gradient);
            color: white;
        }

        .stat-icon.teacher-users {
            background: var(--teacher-gradient);
            color: white;
        }

        .stat-info {
            flex: 1;
        }

        .stat-info h3 {
            font-size: 36px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-info p {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-change {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        /* 快捷操作样式 */
        .quick-actions {
            background: var(--card-bg);
            border-radius: var(--border-radius-xl);
            padding: 30px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .quick-actions:hover {
            box-shadow: var(--shadow-lg);
        }

        .quick-actions h2 {
            color: var(--text-primary);
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-actions h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: var(--primary-gradient);
            border-radius: var(--border-radius-sm);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .action-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: var(--border-radius-lg);
            padding: 28px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: var(--transition);
        }

        .action-card:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-6px) scale(1.03);
            box-shadow: var(--shadow-lg);
        }

        .action-card:hover::before {
            left: 100%;
        }

        .action-card i {
            font-size: 36px;
            margin-bottom: 12px;
            transition: var(--transition);
        }

        .action-card:hover i {
            transform: scale(1.2) rotate(15deg);
        }

        .action-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .action-card p {
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.5;
        }

        /* 添加新的快捷操作卡片 */
        .action-card.gradient-1 {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .action-card.gradient-2 {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.1) 0%, rgba(245, 87, 108, 0.1) 100%);
        }

        .action-card.gradient-3 {
            background: linear-gradient(135deg, rgba(74, 172, 254, 0.1) 0%, rgba(0, 242, 254, 0.1) 100%);
        }

        .action-card.gradient-4 {
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.1) 0%, rgba(56, 249, 215, 0.1) 100%);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 16px 0;
            }

            .nav-menu {
                display: flex;
                overflow-x: auto;
                padding: 0 16px;
                gap: 8px;
            }

            .nav-item {
                margin-bottom: 0;
            }

            .nav-link {
                flex-direction: column;
                padding: 12px 16px;
                min-width: 100px;
            }

            .nav-link i {
                margin-right: 0;
                margin-bottom: 4px;
            }

            .main-content {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .header h1 {
                font-size: 24px;
            }

            .actions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>社团管理系统</h2>
                <p>管理员后台</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>仪表盘</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin-user-management.html" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>用户管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/manage-activities.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span>活动管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span>系统设置</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>退出登录</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <header class="header">
                <h1>管理员仪表盘</h1>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="username">系统管理员</span>
                </div>
            </header>

            <!-- 统计卡片 -->
            <section class="stats-grid">
                <div class="stat-card" id="card-total-users" style="cursor: pointer;">
                    <div class="stat-icon total-users">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-users">0</h3>
                        <p>总用户数</p>
                    </div>
                </div>

                <div class="stat-card" id="card-total-activities" style="cursor: pointer;">
                    <div class="stat-icon total-activities">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-activities">0</h3>
                        <p>总活动数</p>
                    </div>
                </div>

                <div class="stat-card" id="card-student-users" style="cursor: pointer;">
                    <div class="stat-icon student-users">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="student-users">0</h3>
                        <p>学生用户数</p>
                    </div>
                </div>

                <div class="stat-card" id="card-teacher-users" style="cursor: pointer;">
                    <div class="stat-icon teacher-users">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="teacher-users">0</h3>
                        <p>教师用户数</p>
                    </div>
                </div>
            </section>

            <!-- 快捷操作 -->
            <section class="quick-actions">
                <h2>快捷操作</h2>
                <div class="actions-grid">
                    <div class="action-card gradient-1" id="add-user">
                        <i class="fas fa-user-plus"></i>
                        <h3>添加用户</h3>
                        <p>创建新的系统用户</p>
                    </div>
                    <div class="action-card gradient-1" id="manage-users">
                        <i class="fas fa-user-cog"></i>
                        <h3>用户管理</h3>
                        <p>查看和管理所有用户</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 确保用户已登录且是管理员
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || user.role !== 'ADMIN') {
            window.location.href = '/dashboard.html';
        }
        
        // 获取用户信息
        if (user && user.name) {
            document.getElementById('username').textContent = user.name;
        }
        
        // 获取统计数据
        async function fetchStatistics() {
            try {
                const response = await fetch('/api/statistics/admin-dashboard');
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('total-users').textContent = result.data.totalUserCount;
                    document.getElementById('total-activities').textContent = result.data.totalActivityCount;
                    document.getElementById('student-users').textContent = result.data.studentCount;
                    document.getElementById('teacher-users').textContent = result.data.teacherCount;
                    
                    // 更新最后更新时间
                    const lastUpdatedElement = document.getElementById('last-updated');
                    if (lastUpdatedElement) {
                        const lastUpdated = new Date(result.data.lastUpdated);
                        lastUpdatedElement.textContent = `数据最后更新于: ${lastUpdated.toLocaleString('zh-CN')}`;
                    }
                }
            } catch (error) {
                console.error('获取统计数据失败:', error);
            }
        }
        
        // 页面加载时获取统计数据
        window.onload = fetchStatistics;
        
        // 定时刷新统计数据（每30秒刷新一次）
        setInterval(fetchStatistics, 30000);
        
        // 快捷操作功能
        console.log('设置快捷操作功能...');
        
        const addUserBtn = document.getElementById('add-user');
        console.log('add-user 按钮:', addUserBtn);
        if (addUserBtn) {
            addUserBtn.addEventListener('click', function() {
                // 跳转到添加用户页面
                console.log('点击添加用户按钮，跳转到 /add-user.html');
                window.location.href = '/add-user.html';
            });
        }
        
        const manageUsersBtn = document.getElementById('manage-users');
        console.log('manage-users 按钮:', manageUsersBtn);
        if (manageUsersBtn) {
            manageUsersBtn.addEventListener('click', function() {
                // 跳转到用户管理页面
                console.log('点击用户管理按钮，跳转到 /admin-user-management.html');
                window.location.href = '/admin-user-management.html';
            });
        }
        

        
        // 统计卡片点击事件
        document.getElementById('card-total-users').addEventListener('click', function() {
            // 跳转到用户管理页面
            window.location.href = '/admin-user-management.html';
        });
        
        document.getElementById('card-total-activities').addEventListener('click', function() {
            // 跳转到活动管理页面
            window.location.href = '/manage-activities.html';
        });
        
        document.getElementById('card-student-users').addEventListener('click', function() {
            // 跳转到学生用户管理页面
            window.location.href = '/admin-user-management.html?role=student';
        });
        
        document.getElementById('card-teacher-users').addEventListener('click', function() {
            // 跳转到教师用户管理页面
            window.location.href = '/admin-user-management.html?role=teacher';
        });
    </script>
</body>
</html>
