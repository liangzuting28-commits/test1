<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加用户 - 社团管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .header:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .header h1 i {
            color: #667eea;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .add-user-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 0 auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .add-user-form:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .form-group:focus-within label {
            color: #667eea;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background-color: white;
            transform: translateY(-1px);
        }

        .form-group input.error,
        .form-group select.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1);
        }

        .form-group input.success,
        .form-group select.success {
            border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .form-group .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .form-group .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group .success-message {
            color: #2ecc71;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .form-group .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-indicator {
            display: flex;
            gap: 3px;
            margin-top: 5px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: #e0e0e0;
            transition: all 0.3s ease;
        }

        .strength-bar.weak {
            background-color: #e74c3c;
        }

        .strength-bar.medium {
            background-color: #f39c12;
        }

        .strength-bar.strong {
            background-color: #2ecc71;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #f0f0f0;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* 返回按钮 */
        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .add-user-form {
                padding: 25px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/admin-dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回仪表盘
            </a>
            <h1><i class="fas fa-user-plus"></i> 添加用户</h1>
        </div>

        <div class="add-user-form">
            <form id="addUserForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentId">用户ID</label>
                        <input type="text" id="studentId" name="studentId" required placeholder="请输入用户ID">
                        <div class="error-message">用户ID不能为空</div>
                    </div>
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required placeholder="请输入用户姓名">
                        <div class="error-message">姓名不能为空</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码">
                        <div class="password-strength">
                            <span id="strengthText">密码强度: 弱</span>
                            <div class="strength-indicator">
                                <div class="strength-bar weak"></div>
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                            </div>
                        </div>
                        <div class="error-message">密码不能为空且至少6位</div>
                    </div>
                    <div class="form-group">
                        <label for="role">角色</label>
                        <select id="role" name="role" required>
                            <option value="">请选择角色</option>
                            <option value="STUDENT">学生</option>
                            <option value="PRESIDENT">社长</option>
                            <option value="TEACHER">教师</option>
                            <option value="ADMIN">管理员</option>
                        </select>
                        <div class="error-message">请选择角色</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="college">学院</label>
                        <input type="text" id="college" name="college" required placeholder="请输入学院">
                        <div class="error-message">学院不能为空</div>
                    </div>
                    <div class="form-group">
                        <label for="majorClass">班级</label>
                        <input type="text" id="majorClass" name="majorClass" required placeholder="请输入班级">
                        <div class="error-message">班级不能为空</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">手机号</label>
                        <input type="tel" id="phone" name="phone" required placeholder="请输入手机号">
                        <div class="error-message">请输入有效的手机号</div>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required placeholder="请输入邮箱">
                        <div class="error-message">请输入有效的邮箱地址</div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/admin-dashboard.html'">取消</button>
                    <button type="submit" class="btn btn-primary">添加用户</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        console.log('add-user.html 页面开始加载...');
        
        // 确保用户已登录
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/';
        }

        // 表单验证函数
        function validateField(field) {
            const errorMessage = field.nextElementSibling;
            let isValid = true;

            switch (field.id) {
                case 'studentId':
                    if (!field.value.trim()) {
                        errorMessage.textContent = '用户ID不能为空';
                        isValid = false;
                    } else if (field.value.trim().length > 20) {
                        errorMessage.textContent = '用户ID不能超过20个字符';
                        isValid = false;
                    }
                    break;
                case 'name':
                    if (!field.value.trim()) {
                        errorMessage.textContent = '姓名不能为空';
                        isValid = false;
                    } else if (field.value.trim().length > 20) {
                        errorMessage.textContent = '姓名不能超过20个字符';
                        isValid = false;
                    }
                    break;
                case 'password':
                    if (!field.value) {
                        errorMessage.textContent = '密码不能为空';
                        isValid = false;
                    } else if (field.value.length < 6) {
                        errorMessage.textContent = '密码至少6位';
                        isValid = false;
                    }
                    break;
                case 'role':
                    if (!field.value) {
                        errorMessage.textContent = '请选择角色';
                        isValid = false;
                    }
                    break;
                case 'college':
                    if (!field.value.trim()) {
                        errorMessage.textContent = '学院不能为空';
                        isValid = false;
                    } else if (field.value.trim().length > 50) {
                        errorMessage.textContent = '学院名称不能超过50个字符';
                        isValid = false;
                    }
                    break;
                case 'majorClass':
                    if (!field.value.trim()) {
                        errorMessage.textContent = '班级不能为空';
                        isValid = false;
                    } else if (field.value.trim().length > 20) {
                        errorMessage.textContent = '班级名称不能超过20个字符';
                        isValid = false;
                    }
                    break;
                case 'phone':
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!field.value) {
                        errorMessage.textContent = '手机号不能为空';
                        isValid = false;
                    } else if (!phoneRegex.test(field.value)) {
                        errorMessage.textContent = '请输入有效的手机号';
                        isValid = false;
                    }
                    break;
                case 'email':
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!field.value) {
                        errorMessage.textContent = '邮箱不能为空';
                        isValid = false;
                    } else if (!emailRegex.test(field.value)) {
                        errorMessage.textContent = '请输入有效的邮箱地址';
                        isValid = false;
                    }
                    break;
            }

            if (!isValid) {
                field.classList.add('error');
                field.classList.remove('success');
                errorMessage.classList.add('show');
            } else {
                field.classList.remove('error');
                field.classList.add('success');
                errorMessage.classList.remove('show');
            }

            return isValid;
        }

        // 密码强度检测
        function checkPasswordStrength(password) {
            let strength = 0;
            const strengthText = document.getElementById('strengthText');
            const strengthBars = document.querySelectorAll('.strength-bar');
            
            // 重置强度指示器
            strengthBars.forEach(bar => {
                bar.className = 'strength-bar';
            });

            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            let strengthLevel = 'weak';
            let strengthTextContent = '密码强度: 弱';

            if (strength <= 2) {
                strengthLevel = 'weak';
                strengthTextContent = '密码强度: 弱';
            } else if (strength <= 4) {
                strengthLevel = 'medium';
                strengthTextContent = '密码强度: 中';
            } else {
                strengthLevel = 'strong';
                strengthTextContent = '密码强度: 强';
            }

            // 更新强度指示器
            strengthBars.forEach((bar, index) => {
                if (index < strength / 2) {
                    bar.classList.add(strengthLevel);
                }
            });

            strengthText.textContent = strengthTextContent;
        }

        // 表单字段实时验证
        document.querySelectorAll('#addUserForm input, #addUserForm select').forEach(field => {
            field.addEventListener('blur', function() {
                validateField(this);
            });

            // 密码字段额外处理
            if (field.id === 'password') {
                field.addEventListener('input', function() {
                    checkPasswordStrength(this.value);
                    if (this.value) {
                        validateField(this);
                    } else {
                        this.classList.remove('error', 'success');
                        this.nextElementSibling.nextElementSibling.classList.remove('show');
                    }
                });
            }

            // 输入时移除错误状态
            field.addEventListener('input', function() {
                if (this.classList.contains('error')) {
                    this.classList.remove('error');
                    this.nextElementSibling.classList.remove('show');
                }
            });
        });

        // 表单提交处理
        document.getElementById('addUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 验证所有字段
            const fields = document.querySelectorAll('#addUserForm input, #addUserForm select');
            let isFormValid = true;

            fields.forEach(field => {
                if (!validateField(field)) {
                    isFormValid = false;
                }
            });

            if (!isFormValid) {
                alert('请检查表单中的错误并重新提交！');
                return;
            }

            // 显示加载状态
            const submitBtn = this.querySelector('.btn-primary');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '添加中...';
            submitBtn.disabled = true;
            
            const formData = new FormData(this);
            const userData = {
                studentId: formData.get('studentId'),
                name: formData.get('name'),
                password: formData.get('password'),
                role: formData.get('role'),
                college: formData.get('college'),
                majorClass: formData.get('majorClass'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                totalPoints: 0
            };
            
            // 发送添加用户请求
            fetch('/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 使用更美观的提示
                    const successMessage = document.createElement('div');
                    successMessage.style.cssText = `
                        position: fixed;
                        top: 20px;
                        right: 20px;
                        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
                        color: white;
                        padding: 15px 25px;
                        border-radius: 10px;
                        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                        font-weight: 600;
                        z-index: 1000;
                        animation: slideInRight 0.3s ease;
                    `;
                    successMessage.textContent = '用户添加成功！';
                    document.body.appendChild(successMessage);
                    
                    // 延迟跳转
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 1500);
                } else {
                    alert('用户添加失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('添加用户失败:', error);
                alert('添加用户失败，请稍后重试！');
            })
            .finally(() => {
                // 恢复按钮状态
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });

        // 添加滑动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
