<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>���Ź������� - ���Ź���ϵͳ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #667eea;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 i {
            color: #667eea;
        }

        .tabs {
            display: flex;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab.active {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .tab:hover {
            background: rgba(0,0,0,0.05);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .club-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .club-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transform: translateZ(0);
        }

        .club-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .club-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #667eea, #764ba2);
        }

        .club-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .club-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .club-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .club-type {
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .club-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .club-info {
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }

        .info-item i {
            color: #667eea;
            width: 16px;
        }

        .club-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* 社长信息样式 */
        .club-president {
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .club-president h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .president-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        /* 成员列表样式 */
        .club-members {
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .club-members h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 成员卡片网格样式 */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .member-card {
            display: flex;
            align-items: flex-start;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            background-color: #f8f9ff;
        }

        /* 为不同角色添加特殊样式 */
        .member-card[data-role="president"] {
            border-left: 4px solid rgba(243, 156, 18, 0.8);
        }

        .member-card[data-role="manager"] {
            border-left: 4px solid rgba(52, 152, 219, 0.8);
        }

        .member-card[data-role="member"] {
            border-left: 4px solid rgba(39, 174, 96, 0.8);
        }

        .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #333;
        }

        .member-student-id,
        .member-college,
        .member-major {
            font-size: 14px;
            margin: 4px 0;
            color: #666;
        }

        .member-role {
            margin-left: auto;
            display: flex;
            align-items: flex-start;
        }

        /* 角色标签样式 */
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-badge[data-role="president"] {
            background-color: rgba(243, 156, 18, 0.8);
            color: white;
        }

        .role-badge[data-role="manager"] {
            background-color: rgba(52, 152, 219, 0.8);
            color: white;
        }

        .role-badge[data-role="member"] {
            background-color: rgba(39, 174, 96, 0.8);
            color: white;
        }

        .no-members {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
            background-color: white;
            border-radius: 12px;
            border: 2px dashed rgba(102, 126, 234, 0.2);
        }

        .club-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-success::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-success:hover::before {
            left: 100%;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ddd;
        }

        .empty-state p {
            margin-bottom: 10px;
        }

        .empty-state a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }

        /* ģ̬����ʽ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 0;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid #e9ecef;
        }

        .modal-header h3 {
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 i {
            color: #667eea;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: #f8f9fa;
        }

        .modal-body {
            padding: 25px;
        }

        @media (max-width: 768px) {
            .club-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .club-actions {
                flex-direction: column;
            }

            .club-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-users"></i> ���Ź�������</h1>
        <button class="btn btn-primary" onclick="window.location.href='/dashboard.html'">
            <i class="fas fa-arrow-left"></i> �����Ǳ���
        </button>
    </div>

    <!-- ��ǩҳ -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('my-clubs')">
            <i class="fas fa-list"></i> �ҵ�����
        </div>
        <div class="tab" onclick="switchTab('all-clubs')">
            <i class="fas fa-school"></i> ��������
        </div>
    </div>

    <!-- �ҵ����� -->
    <div id="my-clubs" class="content-section active">
        <div class="card">
            <h3><i class="fas fa-list"></i> �ҵ�����</h3>
            <div class="search-box">
                <input type="text" id="searchMyClubs" placeholder="�����ҵ�����..." oninput="searchMyClubs()">
            </div>
            <div id="myClubsList" class="club-grid">
                <!-- ��̬���������б� -->
            </div>
        </div>
    </div>

    <!-- �������� -->
    <div id="all-clubs" class="content-section">
        <div class="card">
            <h3><i class="fas fa-school"></i> ��������</h3>
            <div class="search-box">
                <input type="text" id="searchAllClubs" placeholder="������������..." oninput="searchAllClubs()">
            </div>
            <div id="allClubsList" class="club-grid">
                <!-- ��̬�������������б� -->
            </div>
        </div>
    </div>

<!-- ��������ģ̬�� -->
<div id="clubDetailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> ��������</h3>
            <button class="modal-close" onclick="closeClubDetailModal()">&times;</button>
        </div>
        <div id="clubDetailContent">
            <!-- ��̬������������ -->
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let myClubs = [];
    let allClubs = [];

    // ��ʼ��ҳ��
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        loadMyClubs();
    });

    // 检查登录状态
    function checkLogin() {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            alert('请先登录');
            window.location.href = '/index.html';
            return;
        }

        currentUser = user;
    }

    // �л���ǩҳ
    function switchTab(tabName) {
        // ����������������
        document.querySelectorAll('.content-section').forEach(section => {
            section.classList.remove('active');
        });

        // �Ƴ����б�ǩ��active��
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        // ��ʾѡ�е���������
        document.getElementById(tabName).classList.add('active');

        // Ϊѡ�еı�ǩ����active��
        event.target.classList.add('active');

        // ���ض�Ӧ��ǩ������
        if (tabName === 'my-clubs') {
            loadMyClubs();
        } else if (tabName === 'all-clubs') {
            loadAllClubs();
        }
    }

    // �����ҵ�����
    async function loadMyClubs() {
        try {
            // 根据用户角色展示不同内容
            let endpoint = currentUser.role === 'PRESIDENT' ? '/api/clubs/my-clubs' : '/api/clubs/my-joined-clubs';

            const response = await fetch(endpoint, {
                headers: {
                    'X-User-Id': currentUser.studentId
                }
            });

            const result = await response.json();
            const container = document.getElementById('myClubsList');

            if (result.success && result.data && result.data.length > 0) {
                myClubs = result.data;
                displayMyClubs(myClubs);
            } else {
                const emptyMessage = currentUser.role === 'PRESIDENT' ? 
                    '暂无管理的社团' : 
                    '暂未加入任何社团';

                const actionText = currentUser.role === 'PRESIDENT' ? 
                    '创建第一个社团，开始您的社团管理之旅' : 
                    '去<a href="#" onclick="switchTab(\'all-clubs\')">所有社团</a>浏览并申请加入吧！';

                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users-slash"></i>
                            <p>${emptyMessage}</p>
                            <p>${actionText}</p>
                        </div>
                    `;
            }
        } catch (error) {
            console.error('�����ҵ����Ŵ���:', error);
            const container = document.getElementById('myClubsList');
            container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>����ʧ��</p>
                        <p>��ˢ��ҳ������</p>
                    </div>
                `;
        }
    }

    // ��ʾ�ҵ�����
    function displayMyClubs(clubs) {
        const container = document.getElementById('myClubsList');

        if (clubs.length > 0) {
            container.innerHTML = clubs.map(club => {
                // 根据用户角色显示不同信息
                const isPresident = currentUser.role === 'PRESIDENT';
                const isStudent = currentUser.role === 'STUDENT';

                return `
                        <div class="club-card">
                            <div class="club-header">
                                <div>
                                    <div class="club-title">${club.clubName}</div>
                                    <div class="club-type">${club.clubType}</div>
                                </div>
                                <div class="club-status status-active">${club.status || 'ACTIVE'}</div>
                            </div>
                            <div class="club-info">
                                <div class="info-item">
                                    <i class="fas fa-user"></i>
                                    <span>社长: ${club.presidentDetail?.studentName || club.presidentName || club.presidentId}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-users"></i>
                                    <span>成员数: ${club.memberCount || '未知'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-calendar"></i>
                                    <span>创建时间: ${formatDateTime(club.createdAt)}</span>
                                </div>
                                ${isStudent && club.joinDate ? `
                                <div class="info-item">
                                    <i class="fas fa-calendar-check"></i>
                                    <span>����ʱ��: ${formatDateTime(club.joinDate)}</span>
                                </div>` : ''}
                            </div>
                            <div class="club-description">
                                ${club.introduction || '暂无详细介绍'}
                            </div>
                            <div class="club-actions">
                                <button class="btn btn-primary" onclick="viewClubDetail(${club.clubId})">
                                    <i class="fas fa-info-circle"></i> 详情
                                </button>
                                ${isPresident ? `
                                <button class="btn btn-success" onclick="manageMembers(${club.clubId})">
                                    <i class="fas fa-users"></i> ��Ա����
                                </button>
                                <button class="btn btn-warning" onclick="editClub(${club.clubId})">
                                    <i class="fas fa-edit"></i> �༭
                                </button>
                                <button class="btn btn-info" onclick="showTransferPresidentModal(${club.clubId})">
                                    <i class="fas fa-user-friends"></i> ת���糤
                                </button>
                                <button class="btn btn-danger" onclick="deleteClub(${club.clubId})">
                                    <i class="fas fa-trash"></i> ɾ��
                                </button>` : ''}
                            </div>
                        </div>
                    `;
            }).join('');
        } else {
            const emptyMessage = currentUser.role === 'PRESIDENT' ? 
                '暂无管理的社团' : 
                '暂未加入任何社团';

            const actionText = currentUser.role === 'PRESIDENT' ? 
                '创建第一个社团，开始您的社团管理之旅' : 
                '去<a href="#" onclick="switchTab(\'all-clubs\')">所有社团</a>浏览并申请加入吧！';

            container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users-slash"></i>
                        <p>${emptyMessage}</p>
                        <p>${actionText}</p>
                    </div>
                `;
        }
    }

    // ������������
    async function loadAllClubs() {
        try {
            const response = await fetch('/api/clubs');
            const result = await response.json();
            const container = document.getElementById('allClubsList');

            if (result.success && result.data && result.data.length > 0) {
                allClubs = result.data;
                displayAllClubs(allClubs);
            } else {
                container.innerHTML = `
                        <div class="empty-state">
                        <i class="fas fa-school-slash"></i>
                        <p>暂无社团</p>
                        <p>系统中未添加任何社团</p>
                    </div>
                    `;
            }
        } catch (error) {
            console.error('�����������Ŵ���:', error);
            document.getElementById('allClubsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>����ʧ��</p>
                        <p>��ˢ��ҳ������</p>
                    </div>
                `;
        }
    }

    // ��ʾ��������
    function displayAllClubs(clubs) {
        const container = document.getElementById('allClubsList');

        if (clubs.length > 0) {
            container.innerHTML = clubs.map(club => {
                // 检查用户是否有权限查看详情
                const isJoined = myClubs.some(myClub => myClub.clubId === club.clubId);
                const isPending = currentUser.role === 'STUDENT' && 
                    myClubs.some(myClub => 
                        myClub.clubId === club.clubId && 
                        myClub.applicationStatus === 'PENDING'
                    );

                return `
                        <div class="club-card">
                            <div class="club-header">
                                <div>
                                    <div class="club-title">${club.clubName}</div>
                                    <div class="club-type">${club.clubType}</div>
                                </div>
                                <div class="club-status ${isJoined ? 'status-active' : ''}">${isJoined ? '已加入' : isPending ? '待审核' : ''}</div>
                            </div>
                            <div class="club-info">
                                <div class="info-item">
                                    <i class="fas fa-user"></i>
                                    <span>社长: ${club.presidentDetail?.studentName || club.presidentName || club.presidentId}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-users"></i>
                                    <span>成员数: ${club.memberCount || '未知'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-calendar"></i>
                                    <span>创建时间: ${formatDateTime(club.createdAt)}</span>
                                </div>
                            </div>
                            <div class="club-description">
                                ${club.introduction || '暂无详细介绍'}
                            </div>
                            <div class="club-actions">
                                <button class="btn btn-primary" onclick="viewClubDetail(${club.clubId})">
                                    <i class="fas fa-info-circle"></i> 详情
                                </button>
                                ${currentUser.role === 'STUDENT' && !isJoined ? `
                                <button class="btn btn-success" onclick="applyForClub(${club.clubId})">
                                    <i class="fas fa-plus"></i> 申请加入
                                </button>` : ''}
                            </div>
                        </div>
                    `;
            }).join('');
        } else {
            container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-school-slash"></i>
                        <p>暂无社团</p>
                        <p>系统中未添加任何社团</p>
                    </div>
                `;
        }
    }

    // ѧ�������������
    async function applyForClub(clubId) {
        if (!confirm('ȷ��Ҫ����������������')) {
            return;
        }

        try {
            const response = await fetch(`/api/clubs/${clubId}/apply`, {
                method: 'POST',
                headers: {
                    'X-User-Id': currentUser.studentId
                }
            });

            const result = await response.json();

            if (result.success) {
                alert('�����ύ�ɹ����ȴ��糤��ˣ�');
                // 处理成员列表加载，展示状态
                loadAllClubs();
                // 处理社团列表加载，展示状态
                loadMyClubs();
            } else {
                alert('����ʧ��: ' + result.message);
            }
        } catch (error) {
            console.error('����������Ŵ���:', error);
            alert('����ʱ��������');
        }
    }

    // �鿴��������
    async function viewClubDetail(clubId) {
        try {
            const response = await fetch(`/api/clubs/${clubId}/detail`);
            const result = await response.json();

            if (result.success) {
                const club = result.data;
                const modal = document.getElementById('clubDetailModal');
                const content = document.getElementById('clubDetailContent');

                content.innerHTML = `
                        <div class="club-info">
                            <div class="info-item">
                                <i class="fas fa-heading"></i>
                                <span><strong>��������:</strong> ${club.clubName}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-tag"></i>
                                <span><strong>��������:</strong> ${club.clubType}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-users"></i>
                                <span><strong>��Ա����:</strong> ${club.memberCount} ��</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-calendar"></i>
                                <span><strong>����ʱ��:</strong> ${formatDateTime(club.createdAt)}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-phone"></i>
                                <span><strong>��ϵ��ʽ:</strong> ${club.contactInfo || '����'}</span>
                            </div>
                        </div>
                        <div class="club-description">
                            <strong>���Ž���:</strong><br>
                            ${club.introduction || '������ϸ����'}
                        </div>
                        
                        <!-- 社长详细信息 -->
                        <div class="club-president">
                            <h4><i class="fas fa-user-tie"></i>社长信息</h4>
                            <div class="president-details">
                                <div class="info-item">
                                    <i class="fas fa-id-card"></i>
                                    <span><strong>学号:</strong> ${club.presidentDetail?.studentId || '暂无'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-user"></i>
                                    <span><strong>姓名:</strong> ${club.presidentDetail?.studentName || '暂无'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-university"></i>
                                    <span><strong>学院:</strong> ${club.presidentDetail?.college || '暂无'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-graduation-cap"></i>
                                    <span><strong>专业班级:</strong> ${club.presidentDetail?.majorClass || '暂无'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-envelope"></i>
                                    <span><strong>邮箱:</strong> ${club.presidentDetail?.email || '暂无'}</span>
                                </div>
                                <div class="info-item">
                                    <i class="fas fa-phone"></i>
                                    <span><strong>联系电话:</strong> ${club.presidentDetail?.phone || '暂无'}</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 成员列表 -->
                        <div class="club-members">
                            <h4><i class="fas fa-users"></i>成员列表</h4>
                            <div class="members-grid">
                                ${club.members?.map(member => {
                                        const roleText = member.role === 'president' ? '社长' : member.role === 'manager' ? '管理员' : '成员';
                                        // 生成首字母头像
                                        const initials = member.studentName ? member.studentName.charAt(0).toUpperCase() : 'U';
                                        return `
                                            <div class="member-card" data-role="${member.role}">
                                                <div class="member-avatar">${initials}</div>
                                                <div class="member-info">
                                                    <div class="member-name">${member.studentName}</div>
                                                    <div class="member-student-id">学号: ${member.studentId}</div>
                                                    <div class="member-college">学院: ${member.college || '暂无'}</div>
                                                    <div class="member-major">专业班级: ${member.majorClass || '暂无'}</div>
                                                </div>
                                                <div class="member-role">
                                                    <span class="role-badge" data-role="${member.role}">${roleText}</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('') || '<div class="no-members">暂无成员信息</div>'}
                            </div>
                        </div>
                        <div style="margin-top: 20px; text-align: center;">
                            <button class="btn btn-primary" onclick="closeClubDetailModal()">
                                <i class="fas fa-times"></i> 关闭
                            </button>
                        </div>
                    `;

                modal.style.display = 'flex';
            } else {
                alert('获取社团详情失败: ' + result.message);
            }
        } catch (error) {
            console.error('获取社团详情错误:', error);
            alert('获取社团详情时发生错误');
        }
    }

    // 关闭社团详情模态框
    function closeClubDetailModal() {
        document.getElementById('clubDetailModal').style.display = 'none';
    }

    // �����ҵ�����
    function searchMyClubs() {
        const searchTerm = document.getElementById('searchMyClubs').value.toLowerCase();

        if (!searchTerm) {
            displayMyClubs(myClubs);
            return;
        }

        const filteredClubs = myClubs.filter(club => 
            club.clubName.toLowerCase().includes(searchTerm)
        );

        displayMyClubs(filteredClubs);
    }

    // ������������
    function searchAllClubs() {
        const searchTerm = document.getElementById('searchAllClubs').value.toLowerCase();

        if (!searchTerm) {
            displayAllClubs(allClubs);
            return;
        }

        const filteredClubs = allClubs.filter(club => 
            club.clubName.toLowerCase().includes(searchTerm)
        );

        displayAllClubs(filteredClubs);
    }

    /**
     * ���ߺ�������ʽ������ʱ��
     */
    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return 'δ֪ʱ��';
        const date = new Date(dateTimeStr);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
</script>
</body>
